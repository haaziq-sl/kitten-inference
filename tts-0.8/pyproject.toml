[build-system]
# Pinned exactly (like hatchling==1.27.0 for the pure-Python distributions), so the wheel a release tag builds is
# built with the same backend as the one CI tested; an unpinned range would let these drift between runs.
# scikit-build-core 1.1 and pybind11 3.1 need Python 3.9, so the cp38 wheels keep the last releases for 3.8 (the
# versions the cp38 wheels were built and tested with before the pin).
requires = [
    "scikit-build-core==1.1.1; python_version >= '3.9'",
    "scikit-build-core==1.0.3; python_version < '3.9'",
    "pybind11==3.1.0; python_version >= '3.9'",
    "pybind11==3.0.4; python_version < '3.9'",
]
build-backend = "scikit_build_core.build"

[project]
# An internal build name: these wheels are never uploaded. They are build inputs of the kitten-inference wheels, which
# take their TTS 0.8 files unchanged, except four Python files (message text and an import check; tts08_python_overlay
# in .github/release-inputs.json) taken from the release commit. The name stays because auditwheel and delvewheel name
# kitten_inference_tts08.libs/ after it, and the engine's RPATH and the Windows DLL patch in tts08/__init__.py point
# there.
name = "kitten-inference-tts08"
version = "0.2.0"
description = "Kitten TTS 0.8 (15M, 40M and 80M models) on a native C++ engine"
readme = "README.md"
# KittenML's code is Apache-2.0; the wheels also carry third-party code (NOTICE says which wheel has what): stb (MIT)
# and pybind11 (BSD-3-Clause) in every wheel, libgomp (GPL-3.0-or-later WITH GCC-exception-3.1) in the Linux wheels,
# libc++ (Apache-2.0 WITH LLVM-exception) in the Android wheel and the Microsoft Visual C++ runtime in the Windows
# wheels.
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND GPL-3.0-or-later WITH GCC-exception-3.1 AND Apache-2.0 WITH LLVM-exception AND LicenseRef-Microsoft-Visual-C-Runtime"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{ name = "KittenML" }]
requires-python = ">=3.8"
# Lower bounds are the oldest versions tested (CI job "lowest dependencies"). The [tts-0.8] extra in
# umbrella/pyproject.toml must name the same (the assembler refuses drift); this wheel's own tests install them.
# espeakng_loader 0.2.4 is the first whose Linux x86_64 library runs on glibc 2.29 (older ones need 2.34);
# phonemizer 3.3 is the first that does not need setuptools (pkg_resources) at run time.
dependencies = [
    "espeakng_loader>=0.2.4",
    "phonemizer>=3.3",
    "soundfile>=0.12.1",
    "numpy>=1.23",
    "huggingface_hub>=0.20",
]
keywords = ["text-to-speech", "tts", "speech-synthesis", "kitten-tts"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/KittenML/kitten-inference"
Source = "https://github.com/KittenML/kitten-inference/tree/main/tts-0.8"
Issues = "https://github.com/KittenML/kitten-inference/issues"

[tool.scikit-build]
minimum-version = "0.12"
build-dir = "build/{wheel_tag}"
cmake.source-dir = "engine"
cmake.build-type = "Release"
cmake.define = { ENABLE_CUDA = "OFF", ENABLE_NATIVE_ARCH = "OFF", KITTEN_BUILD_EXTRAS = "OFF" }
build.targets = ["_engine"]
install.components = ["python"]
install.strip = true
wheel.platlib = true
# Only kitten_inference/tts08 is shipped. kitten_inference/__init__.py comes from umbrella/ when the
# kitten-inference wheels are assembled, so this one never installs it.
wheel.packages = { "kitten_inference/tts08" = "kitten_inference/tts08" }
wheel.exclude = ["**/__pycache__", "**/*.py[co]"]
sdist.exclude = [".venv*", "build*", "dist", "wheelhouse", "audio-smoke*", ".hf-cache"]
