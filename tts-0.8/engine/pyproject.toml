[build-system]
requires = [
    "scikit-build-core>=0.12",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "kitten-inference"
version = "0.1.1"
description = "Native KittenTTS inference runtime powered by C++ kernels"
readme = "README.pypi.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.23; platform_system != 'Android'",
]

[tool.scikit-build]
minimum-version = "0.12"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake]
build-type = "Release"
define = { ENABLE_CUDA = "OFF", ENABLE_NATIVE_ARCH = "OFF" }

[tool.scikit-build.build]
targets = ["model_inference"]

[tool.scikit-build.install]
components = ["python"]
strip = true

[tool.scikit-build.wheel]
packages = []
platlib = true

[tool.scikit-build.sdist]
exclude = [
    ".venv*",
    "build*",
    "dist",
    "results",
    "weights",
    "test_assets",
]
