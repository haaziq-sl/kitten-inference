name: tts-2 ROCm wheel

# kitten-inference-tts2-rocm: the HIP engine library, the native CLI and the text-data helper, built in the
# manylinux_2_28 container with ROCm 7.1 from AMD's RHEL 8 repository (tts-2/packaging/build_wheel_rocm.sh).
# The runners have no AMD GPU: the install job checks the package and the documented missing-ROCm failure only.

on:
  push:
    branches: [ws/rocm, feat/tts-0.8-and-tts-2]
    paths: ['tts-2/**', '.github/workflows/tts-2-rocm.yml']
  pull_request:
    paths: ['tts-2/**', '.github/workflows/tts-2-rocm.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Distribution version, e.g. 0.2.0.post1 for a packaging fix (empty: the engine version)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tts-2-rocm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: build (manylinux_2_28 x86_64, ROCm 7.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the wheel
        env:
          JOBS: '4'
          WHEEL_VERSION: ${{ github.event.inputs.version }}
        run: tts-2/packaging/build_wheel_rocm.sh wheelhouse
      - name: Size and contents
        run: |
          ls -l wheelhouse
          whl=$(ls wheelhouse/*.whl)
          size=$(stat -c %s "$whl")
          {
            echo "### $(basename "$whl")"
            echo "Size: $size bytes ($(( size / 1000000 )) MB)"
            echo '```'
            sed -n '1,9p' wheelhouse/build-rocm-wheel.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge 100000000 ]; then echo "::warning::the wheel is over PyPI's default 100 MB file limit"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: kitten-inference-tts2-rocm-manylinux_2_28_x86_64
          path: wheelhouse/
          if-no-files-found: error

  install:
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kitten-inference-tts2-rocm-manylinux_2_28_x86_64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install into a fresh virtual environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install --no-index --no-deps wheelhouse/*.whl
          venv/bin/python -m pip show -f kitten-inference-tts2-rocm | head -n 20
      - name: Check the package
        run: |
          venv/bin/python - wheelhouse/*.whl << 'PY'
          import os, sys, kitten_inference._tts2_rocm as m
          assert m.BACKEND == "rocm" and m.ABI == 2 and m.CAPS == (), (m.BACKEND, m.ABI, m.CAPS)
          wheel_version = os.path.basename(sys.argv[1]).split("-")[1]
          assert m.VERSION == wheel_version, (m.VERSION, wheel_version)
          for p in (m.LIB, m.CLI, m.TEXT_DATA_TOOL):
              assert p.is_file(), p
          for p in (m.CLI, m.TEXT_DATA_TOOL):
              assert os.access(p, os.X_OK), p
          print(m.VERSION, m.BUILD_INFO, m.HIP_ARCHS)
          PY
      - name: Text-data helper runs without ROCm
        run: |
          tool=$(venv/bin/python -c 'import kitten_inference._tts2_rocm as m; print(m.TEXT_DATA_TOOL)')
          "$tool" --help > help.txt 2>&1 || true
          head -n 5 help.txt
          ldd "$tool"
      - name: Without ROCm the engine reports the missing runtime
        run: |
          cli=$(venv/bin/python -c 'import kitten_inference._tts2_rocm as m; print(m.CLI)')
          if "$cli" --help > out.txt 2>&1; then echo "expected a loader error without ROCm"; cat out.txt; exit 1; fi
          cat out.txt
          grep -q 'libamdhip64.so.7' out.txt
