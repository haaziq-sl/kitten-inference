name: tts-2 ROCm wheel

# Kitten TTS 2 engine for AMD GPUs: the ROCm payload wheel (the HIP engine library, the native CLI and the text-data
# helper) that the kitten-inference wheels for Linux x86-64 are assembled from (packages.yml), built in the
# manylinux_2_28 container with ROCm 7.1 from AMD's RHEL 8 repository (tts-2/packaging/build_wheel_rocm.sh).
# The runners have no AMD GPU: the install job checks the package and the documented missing-ROCm failure only.
# Nothing here is uploaded to PyPI: a release takes the wheel of a tested run, pinned in .github/release-inputs.json,
# from its artifact (kept 90 days; .github/RELEASING.md).

on:
  push:
    branches: ['**']
    paths: ['tts-2/**', '.github/workflows/tts-2-rocm.yml']
  pull_request:
    paths: ['tts-2/**', '.github/workflows/tts-2-rocm.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tts-2-rocm-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheel:
    name: build (manylinux_2_28 x86_64, ROCm 7.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the wheel
        env:
          JOBS: '4'
        run: tts-2/packaging/build_wheel_rocm.sh wheelhouse
      - name: Size and contents
        run: |
          ls -l wheelhouse
          whl=$(ls wheelhouse/*.whl)
          size=$(stat -c %s "$whl")
          {
            echo "### $(basename "$whl")"
            echo "Size: $size bytes ($(( size / 1000000 )) MB)"
            echo '```'
            sed -n '1,9p' wheelhouse/build-rocm-wheel.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge 100000000 ]; then echo "::warning::the wheel is over PyPI's default 100 MB file limit"; fi
      # Release input: kept 90 days (.github/RELEASING.md).
      - uses: actions/upload-artifact@v4
        with:
          name: kitten-inference-tts2-rocm-manylinux_2_28_x86_64
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 90

  install:
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kitten-inference-tts2-rocm-manylinux_2_28_x86_64
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install into a fresh virtual environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install --no-index --no-deps wheelhouse/*.whl
          venv/bin/python -m pip show -f kitten-inference-tts2-rocm | head -n 20
      # BACKEND, ABI, CAPS, VERSION == the engine version in tts-2/CMakeLists.txt, the files are there and executable,
      # the text-data helper runs, and without ROCm the library and the CLI fail naming libamdhip64.so.7.
      - name: Check the package
        run: |
          ldd "$(venv/bin/python -c 'import kitten_inference._tts2_rocm as m; print(m.TEXT_DATA_TOOL)')"
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/venv/bin/python" "$GITHUB_WORKSPACE/tts-2/packaging/smoke_wheel.py" --backend rocm
