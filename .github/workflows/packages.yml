# The two pure-Python distributions: kitten-inference (umbrella, extras only) and kitten-inference-tts2 (Python API
# and kitten-tts2 command). Builds both wheels, installs them from a local folder on Linux, Windows and macOS for
# every supported Python, checks what each extra installs (engine wheels are stand-ins with the real platform tags),
# runs the unit tests, and records how Ubuntu 22.04's pip 22.0.2 treats the extras.
# Run by hand with engine_run=<run id of "tts-2 engine wheels"> it also loads those real engine wheels through
# kitten_inference.tts2 on Linux and Windows runners (no GPU there). A v* tag in KittenML/kitten-inference also uploads
# both distributions to PyPI (jobs publish-tts2 and publish-umbrella, RELEASING.md).
name: packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "umbrella/**"
      - "tts-2/python/**"
      - "tts-2/tools/kt2n_assets/**"
      - "tts-2/include/kt2n/engine.h"
      - "tts-2/NOTICE"
      - "tts-2/licenses/**"
      - ".github/workflows/packages.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "umbrella/**"
      - "tts-2/python/**"
      - "tts-2/tools/kt2n_assets/**"
      - "tts-2/include/kt2n/engine.h"
      - "tts-2/NOTICE"
      - "tts-2/licenses/**"
      - ".github/workflows/packages.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      engine_run:
        description: 'Run id of a "tts-2 engine wheels" run in this repository: also test its real engine wheels'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' umbrella/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TTS2_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tts-2/python/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Build sdists and wheels (each wheel is built from its sdist)
        run: |
          python -m build umbrella --outdir dist
          python -m build tts-2/python --outdir dist
          ls -l dist
      - name: Check the archives
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import glob, os, tarfile, zipfile
          u, t = os.environ["UMBRELLA_VERSION"], os.environ["TTS2_VERSION"]
          umbrella = zipfile.ZipFile(glob.glob(f"dist/kitten_inference-{u}-py3-none-any.whl")[0]).namelist()
          tts2 = zipfile.ZipFile(glob.glob(f"dist/kitten_inference_tts2-{t}-py3-none-any.whl")[0]).namelist()
          assert [n for n in umbrella if not n.startswith(f"kitten_inference-{u}.dist-info/")] == \
              ["kitten_inference/__init__.py"], umbrella
          assert "kitten_inference/__init__.py" not in tts2
          assert not [n for n in tts2 if "__pycache__" in n or n.endswith(".pyc")]
          for need in ("kitten_inference/tts2/__init__.py", "kitten_inference/tts2/_assets/prepare.py",
                       "kitten_inference/tts2/_assets/s3gen_tensors.tsv", "kitten_inference/tts2/NOTICE",
                       "kitten_inference/tts2/licenses/Apache-2.0.txt"):
              assert need in tts2, need
          sdist = tarfile.open(glob.glob(f"dist/kitten_inference_tts2-{t}.tar.gz")[0]).getnames()
          assert any(n.endswith("kitten_inference/tts2/_assets/prepare.py") for n in sdist)
          print(len(umbrella), "files in the umbrella wheel,", len(tts2), "in the tts2 wheel")
          PY
      - name: What the release check says about PyPI today (information only; it gates the umbrella's upload)
        run: python .github/scripts/pypi_ready.py check --pyproject umbrella/pyproject.toml || true
      - name: Stand-in engine wheels (real platform tags) and the earlier kitten-inference 0.1.x
        run: python umbrella/tests/make_stub_wheels.py stubs --old stubs-old
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: stubs
          path: stubs/
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-old
          path: stubs-old/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' umbrella/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TTS2_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tts-2/python/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: stubs
          path: stubs
      - uses: actions/download-artifact@v4
        with:
          name: stubs-old
          path: stubs-old
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # ffmpeg on every OS: the clone_voice decode tests (stdin pipe and by-name fallback) must run everywhere.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: ffmpeg (Windows, the Gyan build that the error message suggests)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ffmpeg -y --no-progress > /dev/null && ffmpeg -version | head -1
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Dependencies wheelhouse (kitten-inference-tts2's own dependencies, from PyPI)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -U pip
          # The dependencies come from the built wheel's metadata. pip wheel: anything without a wheel for this
          # Python is built here, and the log says so.
          python -m pip wheel --disable-pip-version-check --wheel-dir deps dist/kitten_inference_tts2-${{ env.TTS2_VERSION }}-py3-none-any.whl \
            pytest pip 2>&1 | tee deps.log
          rm -f deps/kitten_inference_tts2-*.whl
          echo "Built from source for Python ${{ matrix.python }} on ${{ matrix.os }}:" \
            "$(grep -o 'Building wheel for [^ ]*' deps.log | cut -d' ' -f4 | sort -u | tr '\n' ' ' || true)"
      - name: What each extra installs with current pip (local folders and a local index with 0.1.x, as on PyPI)
        run: >-
          python umbrella/tests/check_extras.py --upgrade-pip --find-links dist --find-links stubs --find-links deps
          --old stubs-old --version "${{ env.UMBRELLA_VERSION }}"
      - name: Install kitten-inference[tts-2] for the unit tests (on macOS, which has no engine wheel, the two packages)
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then SPEC="kitten-inference==$UMBRELLA_VERSION kitten-inference-tts2==$TTS2_VERSION"; \
          else SPEC="kitten-inference[tts-2]==$UMBRELLA_VERSION"; fi
          $PY -m pip install --disable-pip-version-check --no-index --find-links dist --find-links stubs \
            --find-links deps $SPEC pytest
      - name: Unit tests (installed packages; tests/gpu is skipped, no other test may skip)
        shell: bash
        env:
          KT2N_REQUIRE_ABI_TEST: "1"
          KT2N_REQUIRE_FFMPEG: "1"
          KT2N_STRICT_SKIPS: "1"
          KT2N_EXPECT_NO_NVIDIA_DRIVER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/umbrella/tests" \
            "$GITHUB_WORKSPACE/tts-2/python/tests"

  lowest-deps:
    # kitten-inference-tts2's lower bounds (numpy, huggingface-hub, tokenizers, filelock) are the oldest versions
    # tested: the lowest version of each that has a wheel for this Python, with the unit tests. The torch-free weight
    # fold with the oldest numpy is checked byte for byte in tts-2-prepare.yml.
    name: Lowest dependencies, Linux, Python ${{ matrix.python }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' umbrella/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TTS2_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tts-2/python/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: stubs
          path: stubs
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Install kitten-inference[tts-2] with the oldest allowed dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The wheel's own requirements, so that the lower bounds come from the built metadata.
          python3 - "dist/kitten_inference_tts2-$TTS2_VERSION-py3-none-any.whl" > requirements-lowest.txt <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              for line in z.read(meta).decode().splitlines():
                  if line.startswith("Requires-Dist:"):
                      print(line.split(":", 1)[1].strip())
          PY
          cat requirements-lowest.txt
          uv venv -q -p "${{ matrix.python }}" venv
          uv pip install -p venv/bin/python --resolution lowest-direct --no-build --find-links dist --find-links stubs \
            "kitten-inference[tts-2]==$UMBRELLA_VERSION" -r requirements-lowest.txt
          uv pip install -p venv/bin/python pytest
          uv pip freeze -p venv/bin/python
      - name: Unit tests with those versions
        env:
          KT2N_REQUIRE_ABI_TEST: "1"
          KT2N_REQUIRE_FFMPEG: "1"
          KT2N_STRICT_SKIPS: "1"
          KT2N_EXPECT_NO_NVIDIA_DRIVER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/venv/bin/python" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/umbrella/tests" \
            "$GITHUB_WORKSPACE/tts-2/python/tests"

  engine-wheels:
    # By hand only (workflow_dispatch with engine_run): the real engine wheels of that run, installed with the two
    # pure wheels and loaded through kitten_inference.tts2. The runners have no GPU.
    if: github.event_name == 'workflow_dispatch' && inputs.engine_run != ''
    needs: build
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: tts2-cu12-linux
          - os: windows-2022
            artifact: tts2-cu12-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' umbrella/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TTS2_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tts-2/python/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: engine
          run-id: ${{ inputs.engine_run }}
          github-token: ${{ github.token }}
      - name: Install the umbrella, kitten-inference-tts2 and the real engine wheel
        shell: bash
        run: |
          ls -lR engine | head -20
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --disable-pip-version-check -q -U pip
          $PY -m pip install --disable-pip-version-check dist/kitten_inference-$UMBRELLA_VERSION-py3-none-any.whl \
            dist/kitten_inference_tts2-$TTS2_VERSION-py3-none-any.whl $(find engine -name 'kitten_inference_tts2_cu12-*.whl')
          sha256sum $(find engine -name '*.whl')
      - name: Load the engine through kitten_inference.tts2 (no GPU)
        shell: bash
        run: |
          if [ -d venv/Scripts ]; then export PATH="$PWD/venv/Scripts:$PATH"; else export PATH="$PWD/venv/bin:$PATH"; fi
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/.github/scripts/engine_smoke.py"

  old-pip:
    # Ubuntu 22.04's own pip (22.0.2): does "kitten-inference[tts-0.8]" install the engine?
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: stubs
          path: stubs
      - name: System pip
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip python3-venv > /dev/null
          python3 --version && python3 -m pip --version
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' umbrella/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TTS2_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tts-2/python/pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Install each spelling with pip 22.0.2
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip download -q --dest deps "dist/kitten_inference_tts2-$TTS2_VERSION-py3-none-any.whl"
          rm -f deps/kitten_inference_tts2-*.whl
          V=$UMBRELLA_VERSION
          for spec in "kitten-inference[tts-0.8]==$V" "kitten-inference[tts-0-8]==$V" \
                      "kitten-inference[tts-2]==$V" "kitten-inference[tts-2-rocm]==$V"; do
            echo "::group::$spec"
            echo "$ python3 -m pip install --no-index --find-links dist --find-links stubs --find-links deps \"$spec\""
            python3 -m pip install --no-index --find-links dist --find-links stubs --find-links deps "$spec" 2>&1 \
              | tee -a old-pip.log
            echo "installed: $(python3 -m pip list 2>/dev/null | grep -i '^kitten' | tr -s ' ' | tr '\n' ';')" \
              | tee -a old-pip.log
            python3 -m pip uninstall -y -q kitten-inference kitten-inference-tts08 kitten-inference-tts2 \
              kitten-inference-tts2-cu12 kitten-inference-tts2-rocm 2>/dev/null || true
            echo "::endgroup::"
          done
      - name: Which pip versions accept the dotted spelling [tts-0.8]
        shell: bash
        run: |
          set +e +o pipefail  # grep -c exits 1 when it counts 0
          for v in 22.0.2 22.3.1 23.0.1 23.1.2 23.2.1 23.3 23.3.2 24.0 25.3; do
            rm -rf /tmp/v && python3 -m venv /tmp/v && /tmp/v/bin/python -m pip install -q --disable-pip-version-check "pip==$v"
            out=$(/tmp/v/bin/python -m pip install --disable-pip-version-check --no-index --find-links dist \
                  --find-links stubs "kitten-inference[tts-0.8]==$UMBRELLA_VERSION" 2>&1)
            got=$(/tmp/v/bin/python -m pip list --disable-pip-version-check 2>/dev/null | grep -ci '^kitten-inference-tts08')
            echo "pip $v: [tts-0.8] installs kitten-inference-tts08: $([ "$got" = 1 ] && echo yes || echo no)$(echo "$out" | grep -o "WARNING: .*extra.*" | sed 's/^/ -- /')" \
              | tee -a old-pip.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: old-pip-log
          path: old-pip.log

  # Releases only: a v* tag pushed to KittenML/kitten-inference (never a fork), with PyPI trusted publishing. The order
  # on PyPI: the engine wheels (kitten-inference-tts2-cu12, -rocm: their own workflows), then kitten-inference-tts2
  # (and kitten-inference-tts08, its own workflow), then the umbrella, once every distribution its extras name is on
  # PyPI: published first, its extras would point at nothing. Each wait gives up after 5 hours (the Windows CUDA wheel can take 2.5); once the missing
  # distributions are up, re-run the failed job. A tag whose version is not a distribution's version uploads nothing
  # for it (a post release of another distribution).
  publish-tts2:
    if: github.repository == 'KittenML/kitten-inference' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: The files this tag releases
        id: files
        run: python .github/scripts/release_files.py dist upload --dist kitten-inference-tts2
      - name: Wait until the engine wheels are on PyPI
        if: steps.files.outputs.upload == 'true'
        run: |
          python .github/scripts/pypi_ready.py wait --pyproject umbrella/pyproject.toml --timeout-minutes 300 \
            --only kitten-inference-tts2-cu12 --only kitten-inference-tts2-rocm
      - name: Publish to PyPI (trusted publishing)
        if: steps.files.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true

  publish-umbrella:
    if: github.repository == 'KittenML/kitten-inference' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-tts2]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: The files this tag releases
        id: files
        run: python .github/scripts/release_files.py dist upload --dist kitten-inference
      - name: Wait until every distribution the extras name is on PyPI
        if: steps.files.outputs.upload == 'true'
        run: python .github/scripts/pypi_ready.py wait --pyproject umbrella/pyproject.toml --timeout-minutes 300
      - name: Publish to PyPI (trusted publishing)
        if: steps.files.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
