# The two pure-Python distributions: kitten-inference (umbrella, extras only) and kitten-inference-tts2 (Python API
# and kitten-tts2 command). Builds both wheels, installs them from a local folder on Linux, Windows and macOS for
# every supported Python, checks what each extra installs (engine wheels are stand-ins with the real platform tags),
# runs the unit tests, and records how Ubuntu 22.04's pip 22.0.2 treats the extras.
# Run by hand with engine_run=<run id of "tts-2 engine wheels"> it also loads those real engine wheels through
# kitten_inference.tts2 on Linux and Windows runners (no GPU there).
name: packages

on:
  push:
    paths:
      - "umbrella/**"
      - "tts-2/python/**"
      - "tts-2/tools/kt2n_assets/**"
      - "tts-2/include/kt2n/engine.h"
      - "tts-2/NOTICE"
      - "tts-2/licenses/**"
      - ".github/workflows/packages.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "umbrella/**"
      - "tts-2/python/**"
      - "tts-2/tools/kt2n_assets/**"
      - "tts-2/include/kt2n/engine.h"
      - "tts-2/NOTICE"
      - "tts-2/licenses/**"
      - ".github/workflows/packages.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      engine_run:
        description: 'Run id of a "tts-2 engine wheels" run in this repository: also test its real engine wheels'
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
      - name: Build sdists and wheels (each wheel is built from its sdist)
        run: |
          python -m build umbrella --outdir dist
          python -m build tts-2/python --outdir dist
          ls -l dist
      - name: Check the archives
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import glob, tarfile, zipfile
          umbrella = zipfile.ZipFile(glob.glob("dist/kitten_inference-0.2.0-py3-none-any.whl")[0]).namelist()
          tts2 = zipfile.ZipFile(glob.glob("dist/kitten_inference_tts2-0.2.0-py3-none-any.whl")[0]).namelist()
          assert [n for n in umbrella if not n.startswith("kitten_inference-0.2.0.dist-info/")] == \
              ["kitten_inference/__init__.py"], umbrella
          assert "kitten_inference/__init__.py" not in tts2
          assert not [n for n in tts2 if "__pycache__" in n or n.endswith(".pyc")]
          for need in ("kitten_inference/tts2/__init__.py", "kitten_inference/tts2/_assets/prepare.py",
                       "kitten_inference/tts2/_assets/s3gen_tensors.tsv", "kitten_inference/tts2/NOTICE",
                       "kitten_inference/tts2/licenses/Apache-2.0.txt"):
              assert need in tts2, need
          sdist = tarfile.open(glob.glob("dist/kitten_inference_tts2-0.2.0.tar.gz")[0]).getnames()
          assert any(n.endswith("kitten_inference/tts2/_assets/prepare.py") for n in sdist)
          print(len(umbrella), "files in the umbrella wheel,", len(tts2), "in the tts2 wheel")
          PY
      - name: What the release check says about PyPI today (information only; it gates the umbrella's upload)
        run: python .github/scripts/pypi_ready.py check --pyproject umbrella/pyproject.toml || true
      - name: Stand-in engine wheels (real platform tags) and the earlier kitten-inference 0.1.x
        run: python umbrella/tests/make_stub_wheels.py stubs --old stubs-old
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: stubs
          path: stubs/
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-old
          path: stubs-old/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: stubs
          path: stubs
      - uses: actions/download-artifact@v4
        with:
          name: stubs-old
          path: stubs-old
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # ffmpeg on every OS: the clone_voice decode tests (stdin pipe and by-name fallback) must run everywhere.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: ffmpeg (Windows, the Gyan build that the error message suggests)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ffmpeg -y --no-progress > /dev/null && ffmpeg -version | head -1
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Dependencies wheelhouse (kitten-inference-tts2's own dependencies, from PyPI)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -U pip
          # The dependencies come from the built wheel's metadata. pip wheel: anything without a wheel for this
          # Python is built here, and the log says so.
          python -m pip wheel --disable-pip-version-check --wheel-dir deps dist/kitten_inference_tts2-0.2.0-py3-none-any.whl \
            pytest pip 2>&1 | tee deps.log
          rm -f deps/kitten_inference_tts2-*.whl
          echo "Built from source for Python ${{ matrix.python }} on ${{ matrix.os }}:" \
            "$(grep -o 'Building wheel for [^ ]*' deps.log | cut -d' ' -f4 | sort -u | tr '\n' ' ' || true)"
      - name: What each extra installs with current pip (local folders and a local index with 0.1.x, as on PyPI)
        run: python umbrella/tests/check_extras.py --upgrade-pip --find-links dist --find-links stubs --find-links deps --old stubs-old
      - name: Install kitten-inference[tts-2] for the unit tests
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --disable-pip-version-check --no-index --find-links dist --find-links stubs \
            --find-links deps "kitten-inference[tts-2]==0.2.0" pytest
      - name: Unit tests (installed packages; tests/gpu is skipped, no other test may skip)
        shell: bash
        env:
          KT2N_REQUIRE_ABI_TEST: "1"
          KT2N_REQUIRE_FFMPEG: "1"
          KT2N_STRICT_SKIPS: "1"
          KT2N_EXPECT_NO_NVIDIA_DRIVER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/umbrella/tests" \
            "$GITHUB_WORKSPACE/tts-2/python/tests"

  engine-wheels:
    # By hand only (workflow_dispatch with engine_run): the real engine wheels of that run, installed with the two
    # pure wheels and loaded through kitten_inference.tts2. The runners have no GPU.
    if: github.event_name == 'workflow_dispatch' && inputs.engine_run != ''
    needs: build
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: tts2-cu12-linux
          - os: windows-2022
            artifact: tts2-cu12-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: engine
          run-id: ${{ inputs.engine_run }}
          github-token: ${{ github.token }}
      - name: Install the umbrella, kitten-inference-tts2 and the real engine wheel
        shell: bash
        run: |
          ls -lR engine | head -20
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --disable-pip-version-check -q -U pip
          $PY -m pip install --disable-pip-version-check dist/kitten_inference-0.2.0-py3-none-any.whl \
            dist/kitten_inference_tts2-0.2.0-py3-none-any.whl $(find engine -name 'kitten_inference_tts2_cu12-*.whl')
          sha256sum $(find engine -name '*.whl')
      - name: Load the engine through kitten_inference.tts2 (no GPU)
        shell: bash
        run: |
          if [ -d venv/Scripts ]; then export PATH="$PWD/venv/Scripts:$PATH"; else export PATH="$PWD/venv/bin:$PATH"; fi
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/.github/scripts/engine_smoke.py"

  old-pip:
    # Ubuntu 22.04's own pip (22.0.2): does "kitten-inference[tts-0.8]" install the engine?
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: stubs
          path: stubs
      - name: System pip
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip python3-venv > /dev/null
          python3 --version && python3 -m pip --version
      - name: Install each spelling with pip 22.0.2
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip download -q --dest deps dist/kitten_inference_tts2-0.2.0-py3-none-any.whl
          rm -f deps/kitten_inference_tts2-*.whl
          for spec in "kitten-inference[tts-0.8]==0.2.0" "kitten-inference[tts-0-8]==0.2.0" \
                      "kitten-inference[tts-2]==0.2.0" "kitten-inference[tts-2-rocm]==0.2.0"; do
            echo "::group::$spec"
            echo "$ python3 -m pip install --no-index --find-links dist --find-links stubs --find-links deps \"$spec\""
            python3 -m pip install --no-index --find-links dist --find-links stubs --find-links deps "$spec" 2>&1 \
              | tee -a old-pip.log
            echo "installed: $(python3 -m pip list 2>/dev/null | grep -i '^kitten' | tr -s ' ' | tr '\n' ';')" \
              | tee -a old-pip.log
            python3 -m pip uninstall -y -q kitten-inference kitten-inference-tts08 kitten-inference-tts2 \
              kitten-inference-tts2-cu12 kitten-inference-tts2-rocm 2>/dev/null || true
            echo "::endgroup::"
          done
      - name: Which pip versions accept the dotted spelling [tts-0.8]
        shell: bash
        run: |
          set +e +o pipefail  # grep -c exits 1 when it counts 0
          for v in 22.0.2 22.3.1 23.0.1 23.1.2 23.2.1 23.3 23.3.2 24.0 25.3; do
            rm -rf /tmp/v && python3 -m venv /tmp/v && /tmp/v/bin/python -m pip install -q --disable-pip-version-check "pip==$v"
            out=$(/tmp/v/bin/python -m pip install --disable-pip-version-check --no-index --find-links dist \
                  --find-links stubs "kitten-inference[tts-0.8]==0.2.0" 2>&1)
            got=$(/tmp/v/bin/python -m pip list --disable-pip-version-check 2>/dev/null | grep -ci '^kitten-inference-tts08')
            echo "pip $v: [tts-0.8] installs kitten-inference-tts08: $([ "$got" = 1 ] && echo yes || echo no)$(echo "$out" | grep -o "WARNING: .*extra.*" | sed 's/^/ -- /')" \
              | tee -a old-pip.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: old-pip-log
          path: old-pip.log

  # Releases only, from the KittenML repository (never from a fork), with PyPI trusted publishing. kitten-inference-tts2
  # goes first; the umbrella goes only once every distribution its extras name is on PyPI (the engine wheels come
  # from their own workflows or uploads): published first, its extras would point at nothing. The wait gives up after
  # 2 hours; once the engines are up, re-run the failed job.
  publish-tts2:
    if: github.event_name == 'release' && github.repository == 'KittenML/kitten-inference'
    needs: [test]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mkdir upload && mv dist/kitten_inference_tts2-* upload/ && ls -l upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  publish-umbrella:
    if: github.event_name == 'release' && github.repository == 'KittenML/kitten-inference'
    needs: [publish-tts2]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until every distribution the extras name is on PyPI
        run: python .github/scripts/pypi_ready.py wait --pyproject umbrella/pyproject.toml --timeout-minutes 120
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mkdir upload && mv dist/kitten_inference-0* upload/ && ls -l upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
