# kitten-inference, the one package on PyPI. Its wheels are assembled, not built: each is a TTS 0.8 wheel of
# tts-0.8.yml plus the TTS 2 Python API and kitten_inference/__init__.py built here, and on Linux x86-64 and Windows x64
# the TTS 2 engines of tts-2-engine.yml (CUDA) and tts-2-rocm.yml (ROCm, Linux). Those inputs are the GitHub Actions
# artifacts of the runs that built and tested them, in this repository, pinned with every file's sha256 in
# .github/release-inputs.json (the lock): the engine binaries in every wheel are the tested ones, byte for byte.
# Then the 54 wheels are tested on Linux, Windows and macOS. A v* tag in KittenML/kitten-inference also uploads them
# to PyPI (job publish).
# When the lock names another repository (for example a pull request to KittenML before its own lock is committed),
# the jobs that need the inputs are skipped with a notice; on a tag that is an error. A push or pull request is also
# skipped, with a warning, when the lock's artifacts expired or the engine sources, TTS 0.8 sources or versions differ
# from the locked builds' (an engine change, or a new version before its lock); a dry run or tag then fails. Whenever
# the wheels are not assembled, the umbrella and TTS 2 Python unit tests run without them (job source-tests).
name: packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "build_support.py"
      - "CMakeLists.txt"
      - "umbrella/**"
      - "engines/tts2/python/**"
      - "engines/tts2/tools/kt2n_assets/**"
      - "engines/tts2/src/**"
      - "engines/tts2/include/**"
      - "engines/tts2/cli/**"
      - "engines/tts2/cmake/**"
      - "engines/tts2/CMakeLists.txt"
      - "engines/tts2/CMakePresets.json"
      - "engines/tts2/NOTICE"
      - "engines/tts2/licenses/**"
      - "engines/tts2/packaging/smoke_wheel.py"
      - "engines/tts2/packaging/check_wheel_rocm.py"
      - "engines/tts2/packaging/size_check.py"
      - "engines/tts08/engine/**"
      - "engines/tts08/CMakeLists.txt"
      - "engines/tts08/pyproject.toml"
      - "tests/tts08/**"
      - "engines/tts08/NOTICE"
      - "engines/tts08/licenses/**"
      - "NOTICE"
      - "LICENSE"
      - ".github/release-inputs.json"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "build_support.py"
      - "CMakeLists.txt"
      - "umbrella/**"
      - "engines/tts2/python/**"
      - "engines/tts2/tools/kt2n_assets/**"
      - "engines/tts2/src/**"
      - "engines/tts2/include/**"
      - "engines/tts2/cli/**"
      - "engines/tts2/cmake/**"
      - "engines/tts2/CMakeLists.txt"
      - "engines/tts2/CMakePresets.json"
      - "engines/tts2/NOTICE"
      - "engines/tts2/licenses/**"
      - "engines/tts2/packaging/smoke_wheel.py"
      - "engines/tts2/packaging/check_wheel_rocm.py"
      - "engines/tts2/packaging/size_check.py"
      - "engines/tts08/engine/**"
      - "engines/tts08/CMakeLists.txt"
      - "engines/tts08/pyproject.toml"
      - "tests/tts08/**"
      - "engines/tts08/NOTICE"
      - "engines/tts08/licenses/**"
      - "NOTICE"
      - "LICENSE"
      - ".github/release-inputs.json"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  build:
    # The umbrella wheel (kitten_inference/__init__.py and the metadata users see) and the TTS 2 Python API wheel at
    # this commit: inputs of the assembly only, never uploaded.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TTS2_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1 | sed 's/\.post[0-9]*$//')" >> "$GITHUB_ENV"
      - name: Build sdists and wheels (each wheel is built from its sdist)
        run: |
          python -m build umbrella --outdir dist
          python -m build engines/tts2/python --outdir dist
          ls -l dist
      - name: Check the archives
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import glob, os, tarfile, zipfile
          u, t = os.environ["UMBRELLA_VERSION"], os.environ["TTS2_VERSION"]
          umbrella = zipfile.ZipFile(glob.glob(f"dist/kitten_inference-{u}-py3-none-any.whl")[0]).namelist()
          tts2 = zipfile.ZipFile(glob.glob(f"dist/kitten_inference_tts2-{t}-py3-none-any.whl")[0]).namelist()
          assert [n for n in umbrella if not n.startswith(f"kitten_inference-{u}.dist-info/")] == \
              sorted(n for n in umbrella if n.startswith("kitten_inference/") and n.count("/") == 1), umbrella
          assert "kitten_inference/__init__.py" not in tts2
          assert not [n for n in tts2 if "__pycache__" in n or n.endswith(".pyc")]
          for need in ("kitten_inference/tts2/__init__.py", "kitten_inference/tts2/_assets/prepare.py",
                       "kitten_inference/tts2/_assets/s3gen_tensors.tsv", "kitten_inference/tts2/NOTICE",
                       "kitten_inference/tts2/licenses/Apache-2.0.txt"):
              assert need in tts2, need
          sdist = tarfile.open(glob.glob(f"dist/kitten_inference_tts2-{t}.tar.gz")[0]).getnames()
          assert any(n.endswith("kitten_inference/tts2/_assets/prepare.py") for n in sdist)
          print(len(umbrella), "files in the umbrella wheel,", len(tts2), "in the tts2 wheel")
          PY
      - name: Stand-ins of the earlier kitten-inference 0.1.x (the fallback check of check_extras.py)
        run: python tests/packaging/make_stub_wheels.py stubs --old stubs-old
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stubs-old
          path: stubs-old/
          if-no-files-found: error

  lock:
    # Which runs the release inputs come from (.github/release-inputs.json), and whether this run can download them:
    # GitHub Actions artifacts come only from this repository, and only until they expire (90 days). Also what
    # assemble_wheels.py build would refuse at this commit: engine or TTS 0.8 sources other than the locked builds',
    # and versions that do not fit the lock.
    name: Release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      assemble: ${{ steps.lock.outputs.assemble }}
      tts08_run: ${{ steps.lock.outputs.tts08_run }}
      tts08_artifacts: ${{ steps.lock.outputs.tts08_artifacts }}
      cuda_run: ${{ steps.lock.outputs.cuda_run }}
      cuda_artifacts: ${{ steps.lock.outputs.cuda_artifacts }}
      rocm_run: ${{ steps.lock.outputs.rocm_run }}
      rocm_artifacts: ${{ steps.lock.outputs.rocm_artifacts }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the lock; check its runs and their artifacts
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time, tomllib
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          import assemble_wheels as aw  # only the standard library at import

          try:
              lock = aw.load_lock(Path(".github/release-inputs.json"))
          except SystemExit as exc:
              print(f"::error::{str(exc).removeprefix('error: ')}")
              sys.exit(1)
          here = os.environ["GITHUB_REPOSITORY"]
          tag_run = os.environ["GITHUB_REF"].startswith("refs/tags/v")
          by_hand = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          out = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")

          if lock["repository"].lower() != here.lower():
              why = (f"the release inputs are artifacts of {lock['repository']} (.github/release-inputs.json), which "
                     f"a run in {here} cannot download")
              if tag_run:
                  print(f"::error::{why}. A release tag needs a lock of this repository's own runs.")
                  sys.exit(1)
              print(f"::notice::{why}: the jobs that assemble and test the kitten-inference wheels are skipped, and "
                    "the Python unit tests run without them.")
              out.write("assemble=false\n")
              sys.exit(0)

          def gh(path):
              for attempt in range(3):
                  r = subprocess.run(["gh", "api", path], capture_output=True, text=True)
                  if r.returncode == 0:
                      return json.loads(r.stdout)
                  print(f"gh api {path}: {r.stderr.strip()}")
                  time.sleep(10)
              print(f"::error::gh api {path} failed three times")
              sys.exit(1)

          problems = []
          for key in ("tts08", "cuda", "rocm"):
              run = lock["runs"][key]
              rows = [r for r in lock["inputs"] if r["run"] == key]
              names = sorted({r["artifact"] for r in rows})
              ids = {r["artifact"]: r.get("artifact_id") for r in rows}
              info = gh(f"repos/{here}/actions/runs/{run['id']}")
              print(f"{key}: run {run['id']} of {info.get('path')}, commit {info.get('head_sha')}, "
                    f"attempt {info.get('run_attempt')}, {info.get('conclusion')}; artifacts {', '.join(names)}")
              if info.get("conclusion") != "success":
                  problems.append(f"run {run['id']} ({key}) did not succeed: {info.get('conclusion')}")
              if info.get("head_sha") != run["commit"]:
                  problems.append(f"run {run['id']} ({key}) is of commit {info.get('head_sha')}, the lock says "
                                  f"{run['commit']}")
              if str(info.get("path", "")).rsplit("/", 1)[-1] != run["workflow"]:
                  problems.append(f"run {run['id']} ({key}) is of {info.get('path')}, the lock says {run['workflow']}")
              latest = {}
              for a in gh(f"repos/{here}/actions/runs/{run['id']}/artifacts?per_page=100")["artifacts"]:
                  if a["name"] not in latest or a["id"] > latest[a["name"]]["id"]:
                      latest[a["name"]] = a
              for name in names:
                  a = latest.get(name)
                  if a is None:
                      problems.append(f"run {run['id']} has no artifact {name}")
                  elif a.get("expired"):
                      problems.append(f"artifact {name} of run {run['id']} expired on {a.get('expires_at')}")
                  elif ids[name] and a["id"] != ids[name]:
                      problems.append(f"artifact {name} of run {run['id']} is now {a['id']}, the lock has "
                                      f"{ids[name]} (was the run re-run?)")
              # One download per run: its artifacts as one pattern ({a,b} expands, a single name stays as it is).
              pattern = names[0] if len(names) == 1 else "{" + ",".join(names) + "}"
              out.write(f"{key}_run={run['id']}\n{key}_artifacts={pattern}\n")

          # What the assembly would refuse at this commit (the same checks as assemble_wheels.py build): versions
          # that do not fit the lock, and engine or TTS 0.8 sources other than those the locked builds were made from.
          base = lock["version"]
          umbrella = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tts2 = umbrella.split(".post", 1)[0]
          if not re.fullmatch(re.escape(base) + r"(\.post\d+)?", umbrella):
              problems.append(f"kitten-inference {umbrella} (pyproject.toml) is neither {base}, the "
                              "version of the locked builds, nor a post release of it")
          if tts2 != base:
              problems.append(f"pyproject.toml says {tts2}, the locked builds are {base}")
          try:
              aw.check_sources(lock, aw.Source(Path(".")))
          except SystemExit as exc:
              problems.append(str(exc).removeprefix("error: "))

          if problems:
              # A dry run or a tag must assemble. A push or pull request is skipped instead: after the inputs expired,
              # or when it changes the engine sources or the versions before new builds are locked.
              strict = tag_run or by_hand
              for p in problems:
                  print(f"::{'error' if strict else 'warning'}::{p}")
              if strict:
                  sys.exit(1)
              print("::warning::the kitten-inference wheels cannot be assembled from the locked builds at this "
                    "commit: the jobs that assemble and test them are skipped, and the Python unit tests run "
                    "without them. A new release needs new builds and a new lock.")
              out.write("assemble=false\n")
              sys.exit(0)
          out.write("assemble=true\n")
          PY

  assemble:
    name: Assemble the kitten-inference wheels
    needs: [build, lock]
    if: needs.lock.outputs.assemble == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check packaging==25.0 twine==6.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: TTS 0.8 wheels (the artifacts of the engines/tts08 run in the lock)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.lock.outputs.tts08_artifacts }}
          run-id: ${{ needs.lock.outputs.tts08_run }}
          github-token: ${{ github.token }}
          path: in
          merge-multiple: true
      - name: CUDA engine builds (the artifacts of the tts-2 engine run in the lock)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.lock.outputs.cuda_artifacts }}
          run-id: ${{ needs.lock.outputs.cuda_run }}
          github-token: ${{ github.token }}
          path: in
          merge-multiple: true
      - name: ROCm engine build (the artifact of the tts-2 ROCm run in the lock)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.lock.outputs.rocm_artifacts }}
          run-id: ${{ needs.lock.outputs.rocm_run }}
          github-token: ${{ github.token }}
          path: in
          merge-multiple: true
      - name: Every input matches the lock (sha256 and size)
        run: python .github/scripts/assemble_wheels.py verify-inputs --lock .github/release-inputs.json --inputs in
      - name: Assemble (a tag run also requires the packaged sources the lock says were tested)
        run: >-
          python .github/scripts/assemble_wheels.py build --lock .github/release-inputs.json --inputs in --pure dist
          --source . --out assembled ${{ startsWith(github.ref, 'refs/tags/v') && '--tag-run' || '' }}
      - name: Independent check of the assembled wheels (engine files byte for byte against the lock)
        run: python .github/scripts/check_assembled.py --lock .github/release-inputs.json --inputs in --source . assembled/*.whl
      - name: The wheels are the set a release uploads (pypi_ready.COMPLETE)
        run: python .github/scripts/pypi_ready.py complete --dist kitten-inference assembled/*.whl
      - name: Metadata (twine) and sizes (PyPI's file limit is 100 MB)
        run: |
          python -m twine check --strict assembled/*.whl
          python engines/tts2/packaging/size_check.py assembled/*.whl --max-mb 100
      - name: sha256 of every wheel (the tag run must give the same as the dry run)
        shell: bash
        run: |
          (cd assembled && sha256sum *.whl > SHA256SUMS)
          { echo "### sha256 of the assembled wheels"; echo '```'; cat assembled/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # One artifact per platform family, so each test job downloads only its own wheels. A dry run's and a tag run's
      # are kept 90 days: the GPU tests use the dry run's wheels, and the tag run's sha256 list is compared with it.
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-linux-x86_64
          path: assembled/*manylinux*_x86_64.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-linux-aarch64
          path: assembled/*manylinux*_aarch64.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-macos-arm64
          path: assembled/*-macosx_*_arm64.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-macos-x86_64
          path: assembled/*-macosx_*_x86_64.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-windows-x86_64
          path: assembled/*-win_amd64.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-windows-arm64
          path: assembled/*-win_arm64.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-android-arm64
          path: assembled/*-android_*.whl
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: assembly-report
          path: |
            assembled/assembly-report.json
            assembled/SHA256SUMS
          if-no-files-found: warn
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 90 || 14 }}

  test:
    # The wheel pip picks on each runner, installed from a local wheelhouse of the packages its
    # metadata names. TTS 0.8 everywhere: unit tests and an audio check. TTS 2 runs on Linux x86-64 and Windows x64
    # with Python 3.9 or newer: there its unit tests run (no GPU); elsewhere Kitten TTS 2 must say so when it starts.
    name: Test, ${{ matrix.os }}, Python ${{ matrix.python }}
    needs: [build, assemble]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-24.04-arm
            python: "3.9"
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: macos-14
            python: "3.9"
          - os: macos-14
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
          - os: windows-11-arm
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Versions, this runner's wheels, and whether Kitten TTS 2 runs here
        shell: bash
        run: |
          echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) family=linux-x86_64 ;;
            Linux-ARM64) family=linux-aarch64 ;;
            macOS-ARM64) family=macos-arm64 ;;
            macOS-X64) family=macos-x86_64 ;;
            Windows-X64) family=windows-x86_64 ;;
            Windows-ARM64) family=windows-arm64 ;;
            *) echo "::error::no wheels for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
          esac
          tts2=0
          if [ "$family" = linux-x86_64 ] || [ "$family" = windows-x86_64 ]; then
            if [ "${{ matrix.python }}" != 3.8 ]; then tts2=1; fi
          fi
          echo "FAMILY=$family" >> "$GITHUB_ENV"
          echo "TTS2=$tts2" >> "$GITHUB_ENV"
          echo "wheels: $family; Kitten TTS 2 runs here: $([ $tts2 = 1 ] && echo yes || echo no)"
      - uses: actions/download-artifact@v4
        with:
          name: assembled-${{ env.FAMILY }}
          path: assembled
      - uses: actions/download-artifact@v4
        with:
          name: stubs-old
          path: stubs-old
      # A C compiler: the TTS 2 engine ABI test compiles engine.h, and dependencies without a wheel for a new Python
      # are built here.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1: pinned to a commit (a movable tag could run other code in the job)
        if: matrix.os == 'windows-2022'
      # ffmpeg for the TTS 2 unit tests: the clone_voice decode tests (stdin pipe and by-name fallback) must run.
      # Package managers on the runners can stall: each install is retried, with a step time limit.
      - name: ffmpeg (Linux)
        if: env.TTS2 == '1' && runner.os == 'Linux'
        timeout-minutes: 40
        run: bash .github/scripts/apt_install.sh ffmpeg && ffmpeg -version | head -1
      - name: ffmpeg (Windows, the Gyan build that the error message suggests)
        if: env.TTS2 == '1' && runner.os == 'Windows'
        timeout-minutes: 25
        shell: bash
        run: |
          for try in 1 2 3; do
            choco install ffmpeg -y --no-progress --execution-timeout=240 && break
            echo "::warning::choco try $try of 3 failed or timed out"; sleep 10
          done
          ffmpeg -version | head -1
      - name: The wheel pip picks here, and a wheelhouse of the packages its metadata names (from PyPI)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip download --disable-pip-version-check --no-deps --no-index --find-links assembled -d chosen \
            "kitten-inference==$UMBRELLA_VERSION"
          WHEEL=$(ls chosen/*.whl)
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          echo "pip picks $(basename "$WHEEL") (Python ${{ matrix.python }}, ${{ matrix.os }})" | tee -a "$GITHUB_STEP_SUMMARY"
          # pip wheel: a package without a wheel for this Python is built here, and the log says so.
          python -m pip wheel --disable-pip-version-check --wheel-dir deps "${WHEEL}" pytest pip 2>&1 \
            | tee deps.log
          rm -f deps/kitten_inference-*.whl
          echo "Built from source for Python ${{ matrix.python }} on ${{ matrix.os }}:" \
            "$(grep -o 'Building wheel for [^ ]*' deps.log | cut -d' ' -f4 | sort -u | tr '\n' ' ' || true)"
      - name: Plain installation and dependency selection with current pip
        run: >-
          python tests/packaging/check_extras.py --upgrade-pip --find-links assembled --find-links deps
          --old stubs-old --version "${{ env.UMBRELLA_VERSION }}"
      - name: Install kitten-inference
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; BIN=venv/Scripts; else PY=venv/bin/python; BIN=venv/bin; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          # Use the current pip from the wheelhouse.
          $PY -m pip install -q --disable-pip-version-check --no-index --find-links deps -U pip
          $PY -m pip install --disable-pip-version-check --no-index --find-links assembled --find-links deps \
            "kitten-inference==$UMBRELLA_VERSION" pytest
      - name: The installed wheel is the one pip picked, with the engines its platform gets
        shell: bash
        run: |
          "$PY" - "$WHEEL" <<'PY'
          import importlib.metadata as md, os, sys
          from pathlib import Path
          import kitten_inference

          wheel = os.path.basename(sys.argv[1])
          py, abi, plats = wheel[:-len(".whl")].split("-")[2:5]
          wheel_file = md.distribution("kitten_inference").read_text("WHEEL")  # this spelling: Python 3.8 finds it too
          tags = {l.split(":", 1)[1].strip() for l in wheel_file.splitlines() if l.startswith("Tag:")}
          assert tags == {f"{py}-{abi}-{p}" for p in plats.split(".")}, (tags, wheel)
          family, tts2 = os.environ["FAMILY"], os.environ["TTS2"] == "1"
          if family == "linux-x86_64":
              assert "manylinux_2_28_x86_64" in plats.split("."), f"{wheel}: not the manylinux_2_28 build"
          root = Path(kitten_inference.__file__).parent
          want = {"_tts2_cuda": tts2 and family in ("linux-x86_64", "windows-x86_64"),
                  "_tts2_rocm": tts2 and family == "linux-x86_64"}
          for sub in ("tts08", "tts2"):
              assert (root / sub / "__init__.py").is_file(), sub
          for sub, present in want.items():
              assert (root / sub / "__init__.py").is_file() == present, f"{sub}: {'missing' if present else 'unexpected'}"
          print(f"{wheel}: tags {sorted(tags)}; engines: {', '.join(s for s, p in want.items() if p) or 'none'}")
          PY
      - name: Unit tests (installed package; TTS 2's where it runs, tests/gpu skipped, no other test may skip)
        shell: bash
        env:
          KT2N_REQUIRE_ABI_TEST: "1"
          KT2N_REQUIRE_FFMPEG: "1"
          KT2N_STRICT_SKIPS: "1"
          KT2N_EXPECT_NO_NVIDIA_DRIVER: "1"
        run: |
          export KITTEN_RELEASE_WHEEL=1
          tests=("$GITHUB_WORKSPACE/tests/packaging" "$GITHUB_WORKSPACE/tests/test_unified.py")
          if [ "$TTS2" = 1 ]; then tests+=("$GITHUB_WORKSPACE/tests/tts2"); fi
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" -m pytest -q -rs -p no:cacheprovider "${tests[@]}"
      - name: TTS 0.8 unit tests and audio check
        shell: bash
        run: |
          "$PY" -m unittest discover -s tests/tts08 -v
          backend=cpu
          if [ "$FAMILY" = macos-arm64 ]; then backend=auto; fi
          "$PY" tests/tts08/audio_smoke.py --mode release --out-dir audio-smoke --cache-dir .hf-cache \
            --expect-backend "$backend"
      - name: The platform's other wheel family, installed by file name (Linux ARM64 has a manylinux2014 build too)
        shell: bash
        run: |
          set -euo pipefail
          tag="cp${{ matrix.python }}"; tag="${tag/./}"
          for w in assembled/kitten_inference-*-"$tag"-"$tag"-*.whl; do
            if [ "$(basename "$w")" = "$(basename "$WHEEL")" ]; then continue; fi
            echo "::group::$(basename "$w")"
            rm -rf other && python -m venv other
            if [ -x other/Scripts/python.exe ]; then OPY=other/Scripts/python.exe; else OPY=other/bin/python; fi
            "$OPY" -m pip install -q --disable-pip-version-check --no-index --find-links deps -U pip
            "$OPY" -m pip install -q --disable-pip-version-check --no-index --find-links deps "${w}"
            "$OPY" -c "import kitten_inference.tts08, kitten_inference.tts2; print('TTS 0.8 and TTS 2 import')"
            "$OPY" tests/tts08/audio_smoke.py --mode release --out-dir audio-smoke-other --cache-dir .hf-cache \
              --expect-backend cpu
            echo "::endgroup::"
          done
      - name: kitten-tts --model KittenML/kitten-tts-2 --version (on Python 3.8 it must say that Kitten TTS 2 needs 3.9)
        shell: bash
        run: |
          set +e
          out=$("$BIN/kitten-tts" --model KittenML/kitten-tts-2 --version 2>&1); rc=$?
          echo "$out"; echo "exit status $rc"
          if [ "${{ matrix.python }}" = 3.8 ]; then
            if [ "$rc" != 1 ] || ! grep -q "3.9" <<<"$out"; then echo "::error::expected the Python 3.9 message and exit status 1"; exit 1; fi
          elif [ "$rc" != 0 ] || ! grep -qF "$UMBRELLA_VERSION" <<<"$out"; then
            echo "::error::kitten-tts --model KittenML/kitten-tts-2 --version failed"; exit 1
          fi
      - name: Without dependencies (pip install --no-deps), each engine says what to install
        shell: bash
        run: |
          python -m venv bare
          if [ -x bare/Scripts/python.exe ]; then BPY=bare/Scripts/python.exe; else BPY=bare/bin/python; fi
          "$BPY" -m pip install -q --disable-pip-version-check --no-deps "$WHEEL"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$BPY" - <<'PY'
          import os, sys

          def error(code):
              try:
                  exec(code, {})
              except Exception as exc:
                  return f"{type(exc).__name__}: {exc}"
              return None

          family = os.environ["FAMILY"]
          checks = [("import kitten_inference.tts2", None)]
          checks.append(("from kitten_inference.tts08 import KittenTTS", ["kitten-inference"]))
          if sys.version_info < (3, 9):
              checks.append(("from kitten_inference.tts2 import KittenTTS2", ["3.9"]))
          elif family in ("linux-x86_64", "windows-x86_64"):
              checks.append(("from kitten_inference.tts2 import KittenTTS2", ["kitten-inference", "tokenizers"]))
          else:
              checks.append(("from kitten_inference.tts2 import KittenTTS2", ["Linux x86-64", "Windows x64"]))
          bad = 0
          for code, want in checks:
              got = error(code)
              ok = got is None if want is None else got is not None and all(w in got for w in want)
              print(f"{'ok  ' if ok else 'FAIL'} {code}: {got or 'works'}")
              bad += not ok
          sys.exit(1 if bad else 0)
          PY

  source-tests:
    # When the wheels are not assembled (job lock: another repository's lock, expired artifacts, or engine sources or
    # versions other than the locked builds'), the umbrella and TTS 2 Python unit tests still run: on the TTS 2 Python
    # wheel built here, with the umbrella's kitten_inference/__init__.py beside it as in a release wheel, and no
    # engine (the tests use stand-ins). The tests of the assembled kitten-inference skip.
    name: Python tests without the assembled wheels, ${{ matrix.os }}
    needs: [build, lock]
    if: needs.lock.outputs.assemble == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # A C compiler: the TTS 2 engine ABI test compiles engine.h.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1: pinned to a commit (a movable tag could run other code in the job)
        if: runner.os == 'Windows'
      - name: Install the unified package from source
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install -q --disable-pip-version-check -U pip
          $PY -m pip install . pytest
      - name: Unit tests (tests/gpu and the tests of the assembled package skip)
        shell: bash
        env:
          KT2N_REQUIRE_ABI_TEST: "1"
          KT2N_EXPECT_NO_NVIDIA_DRIVER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/tests/packaging" \
            "$GITHUB_WORKSPACE/tests/tts2" "$GITHUB_WORKSPACE/tests/tts08" "$GITHUB_WORKSPACE/tests/test_unified.py"

  engines:
    # The cp312 wheel on runners without a GPU: the engines load through kitten_inference.tts2, their
    # installed files are the lock's, byte for byte, and the programs start. On Linux both engines are installed, and
    # their text-data tools must write the same bytes (one prepared model folder serves both).
    name: Engines, ${{ matrix.os }} (no GPU)
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: assembled-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x86_64
          path: assembled
      - name: Install kitten-inference
        shell: bash
        run: |
          python -m venv venv
          if [ -x venv/Scripts/python.exe ]; then PY=venv/Scripts/python.exe; else PY=venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          wheel=$(ls assembled/kitten_inference-*-cp312-cp312-*.whl)
          $PY -m pip install --disable-pip-version-check -q -U pip
          $PY -m pip install --disable-pip-version-check "${wheel}"
          sha256sum "$wheel"
      - name: Through kitten_inference.tts2 (discovery, load, ABI, unified command, installed files against the lock)
        shell: bash
        run: |
          if [ -d venv/Scripts ]; then export PATH="$PWD/venv/Scripts:$PATH"; else export PATH="$PWD/venv/bin:$PATH"; fi
          lock="$GITHUB_WORKSPACE/.github/release-inputs.json"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/.github/scripts/engine_smoke.py" --lock "$lock"
          if [ "$RUNNER_OS" = Linux ]; then
            "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/.github/scripts/engine_smoke.py" --backend rocm --lock "$lock"
          fi
      - name: The engine packages (layout, version, the programs start; the ROCm one names the runtime it lacks)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/engines/tts2/packaging/smoke_wheel.py"
          if [ "$RUNNER_OS" = Linux ]; then
            "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/engines/tts2/packaging/smoke_wheel.py" --backend rocm
          fi

  old-linux:
    # Ubuntu 20.04 (glibc 2.31) with an upgraded pip: Python 3.8 and 3.12 must get the manylinux_2_28 wheel (on 3.12
    # with both TTS 2 engines), and TTS 0.8 must produce audio on 3.12. What Ubuntu's own pip 20.0.2 does is recorded
    # only: it predates manylinux_2_28, so it finds no 0.2 wheel for Linux x86-64 (the docs upgrade pip first).
    name: Ubuntu 20.04, upgraded pip
    needs: assemble
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assembled-linux-x86_64
          path: assembled
      - name: System Python 3.8 and its pip
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv python3-pip ca-certificates > /dev/null
          ldd --version | head -1
          python3 --version && python3 -m pip --version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6: pinned to a commit (a movable tag could run other code in the job)
        with:
          version: "0.13.5"
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Python 3.8 with an upgraded pip
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv v38
          v38/bin/python -m pip install -q --disable-pip-version-check -U pip
          v38/bin/python -m pip --version
          v38/bin/python -m pip download -q --disable-pip-version-check --no-deps --no-index --find-links assembled \
            -d chosen-38 "kitten-inference==$UMBRELLA_VERSION"
          w=$(ls chosen-38/*.whl)
          echo "pip picks $(basename "$w")"
          case "$w" in *manylinux_2_28_x86_64.whl) ;; *) echo "::error::expected the manylinux_2_28 wheel"; exit 1 ;; esac
          v38/bin/python -m pip install -q --disable-pip-version-check "${w}"
          v38/bin/python -c "import importlib.util as u, kitten_inference.tts08; assert u.find_spec('kitten_inference._tts2_cuda') is None; print('TTS 0.8 imports; no TTS 2 engine on Python 3.8')"
      - name: Python 3.12 with an upgraded pip, then the TTS 0.8 audio check
        shell: bash
        run: |
          set -euo pipefail
          uv venv -q --seed --managed-python -p 3.12 v312
          v312/bin/python -m pip install -q --disable-pip-version-check -U pip
          v312/bin/python -m pip --version
          v312/bin/python -m pip download -q --disable-pip-version-check --no-deps --no-index --find-links assembled \
            -d chosen-312 "kitten-inference==$UMBRELLA_VERSION"
          w=$(ls chosen-312/*.whl)
          echo "pip picks $(basename "$w")"
          case "$w" in *-manylinux_2_28_x86_64.whl) ;; *) echo "::error::expected the manylinux_2_28 wheel"; exit 1 ;; esac
          v312/bin/python -m pip install -q --disable-pip-version-check "${w}"
          v312/bin/python - <<'PY'
          import importlib.util as u
          for m in ("kitten_inference.tts08", "kitten_inference.tts2", "kitten_inference._tts2_cuda",
                    "kitten_inference._tts2_rocm"):
              assert u.find_spec(m) is not None, m
          print("TTS 0.8, TTS 2 and both engines are installed")
          PY
          v312/bin/python tests/tts08/audio_smoke.py --mode release --out-dir audio-smoke --cache-dir .hf-cache \
            --expect-backend cpu
      - name: Ubuntu 20.04's own pip 20.0.2 (recorded, not checked)
        shell: bash
        run: |
          set +e
          {
            python3 -m pip --version
            python3 -m pip download --disable-pip-version-check --no-deps --no-index --find-links assembled \
              -d sys-pip "kitten-inference==$UMBRELLA_VERSION" 2>&1 | tail -n 3
            echo "pip 20.0.2 picks: $(ls sys-pip 2>/dev/null || true)"
          } | tee old-linux.log
          { echo "### Ubuntu 20.04, pip 20.0.2"; echo '```'; cat old-linux.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: old-linux-log
          path: old-linux.log
          if-no-files-found: ignore

  old-pip:
    # Ubuntu 22.04's own pip (22.0.2): plain installation with the system pip; all dependencies are selected without extras.
    name: Ubuntu 22.04, pip 22.0.2
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assembled-linux-x86_64
          path: assembled
      - name: System pip
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip python3-venv > /dev/null
          python3 --version && python3 -m pip --version
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Install with pip 22.0.2
        shell: bash
        run: |
          set -o pipefail
          V=$UMBRELLA_VERSION
          # Resolve all dependencies from the assembled wheel's metadata.
          python3 -m pip download -q --disable-pip-version-check --dest deps \
            "$(ls assembled/kitten_inference-$V-cp310-cp310-*.whl)"
          rm -f deps/kitten_inference-*.whl
          status=0
          for spec in "kitten-inference==$V"; do
            echo "::group::$spec"
            rm -rf /tmp/v && python3 -m venv /tmp/v
            echo "$ $(/tmp/v/bin/python -m pip --version | cut -d' ' -f1-2) install --no-index --find-links assembled --find-links deps \"$spec\"" \
              | tee -a old-pip.log
            /tmp/v/bin/python -m pip install --disable-pip-version-check --no-index --find-links assembled \
              --find-links deps "$spec" 2>&1 | tee -a old-pip.log
            echo "installed: $(/tmp/v/bin/python -m pip list --disable-pip-version-check 2>/dev/null \
              | grep -i -E '^(kitten|espeakng|phonemizer|soundfile|numpy|huggingface|tokenizers|filelock)' \
              | tr -s ' ' | tr '\n' ';')" | tee -a old-pip.log
            tts08=$(/tmp/v/bin/python -c 'from kitten_inference.tts08 import KittenTTS; print("works")' 2>&1 | tail -n 1 || true)
            echo "from kitten_inference.tts08 import KittenTTS: $tts08" | tee -a old-pip.log
            if [ "$tts08" != works ]; then
              echo "::error::plain installation must install what Kitten TTS 0.8 needs"; status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - name: Plain installation with system pip
        shell: bash
        run: |
          set -euo pipefail
          for v in 22.0.2 22.3.1 23.0.1 23.1.2 23.2.1 23.3 23.3.2 24.0 25.3; do
            rm -rf /tmp/v && python3 -m venv /tmp/v && /tmp/v/bin/python -m pip install -q --disable-pip-version-check "pip==$v"
            out=$(/tmp/v/bin/python -m pip install --disable-pip-version-check --no-index --find-links assembled \
                  --find-links deps "kitten-inference==$UMBRELLA_VERSION" 2>&1)
            /tmp/v/bin/python -m pip check
            /tmp/v/bin/python -c 'from kitten_inference import KittenTTS; from kitten_inference.tts2 import KittenTTS2; import espeakng_loader, phonemizer, soundfile, numpy, huggingface_hub, tokenizers, filelock'
            echo "pip $v: installs the dependencies of both model families" \
              | tee -a old-pip.log
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: old-pip-log
          path: old-pip.log

  lowest-deps:
    # The dependency lower bounds are the oldest versions tested: the
    # lowest version of each that has a wheel for this Python, with the unit tests. The torch-free weight fold with
    # the oldest numpy is checked byte for byte in tts-2-prepare.yml; CPU bounds in tts-0.8.yml.
    name: Lowest dependencies, Linux, Python ${{ matrix.python }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Versions (from the pyprojects, which a post release changes)
        shell: bash
        run: echo "UMBRELLA_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6: pinned to a commit (a movable tag could run other code in the job)
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@v4
        with:
          name: assembled-linux-x86_64
          path: assembled
      - name: ffmpeg
        timeout-minutes: 40
        run: bash .github/scripts/apt_install.sh ffmpeg && ffmpeg -version | head -1
      - name: Install kitten-inference with the oldest allowed dependencies
        shell: bash
        env:
          PY: ${{ matrix.python }}
        run: |
          set -euo pipefail
          tag="cp${PY/./}"
          wheel=$(ls assembled/kitten_inference-"$UMBRELLA_VERSION"-"$tag"-"$tag"-*.whl)
          python -m pip install -q --disable-pip-version-check packaging==25.0
          # Parse the assembled METADATA requirements and evaluate their platform markers.
          python - "$wheel" > requirements-lowest.txt <<'PY'
          import sys, zipfile
          from packaging.requirements import Requirement
          with zipfile.ZipFile(sys.argv[1]) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              lines = z.read(meta).decode().splitlines()
          for line in lines:
              if not line.startswith("Requires-Dist:"):
                  continue
              req = Requirement(line.split(":", 1)[1].strip())
              marker = req.marker
              if marker is not None and not marker.evaluate({"extra": ""}):
                  continue  # not for this Python and platform
              extras = f"[{','.join(sorted(req.extras))}]" if req.extras else ""
              print(f"{req.name}{extras}{req.specifier}")
          PY
          cat requirements-lowest.txt
          if [ ! -s requirements-lowest.txt ]; then echo "::error::no  requirements in $wheel"; exit 1; fi
          uv venv -q -p "$PY" venv
          uv pip install -p venv/bin/python --resolution lowest-direct --no-build --find-links assembled \
            "kitten-inference==$UMBRELLA_VERSION" -r requirements-lowest.txt
          uv pip install -p venv/bin/python pytest
          uv pip freeze -p venv/bin/python
      - name: Unit tests with those versions
        env:
          KT2N_REQUIRE_ABI_TEST: "1"
          KT2N_REQUIRE_FFMPEG: "1"
          KT2N_STRICT_SKIPS: "1"
          KT2N_EXPECT_NO_NVIDIA_DRIVER: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/venv/bin/python" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/tests/packaging" \
            "$GITHUB_WORKSPACE/tests/tts2"

  espeak-paths:
    # espeak-ng ends the Python process (exit 1, no exception) when its data folder path is 160 bytes or longer, and on
    # Windows when that path has characters outside ASCII; Kitten TTS 0.8 then gives it a short ASCII copy
    # (kitten_inference/tts08/_espeak_path.py). The Windows x64 wheels also carry the CUDA engine, which makes the
    # installed paths longer: this installs one in such virtual environments and generates audio, twice.
    name: espeak data paths, Windows x64
    needs: assemble
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: assembled-windows-x86_64
          path: wheelhouse
      - name: A virtual environment in a deep folder (espeak-ng data path over 160 characters)
        run: >-
          python tests/tts08/espeak_paths.py deep --wheels wheelhouse --expect fixed --spec "kitten-inference"
          --out espeak-deep.json
      - name: Virtual environments under folders named José and Łukasz
        if: ${{ !cancelled() }}
        run: >-
          python tests/tts08/espeak_paths.py names --wheels wheelhouse --expect fixed --spec "kitten-inference"
          --out espeak-names.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: espeak-paths
          path: espeak-*.json
          if-no-files-found: ignore

  publish:
    # Releases only: a v* tag pushed to KittenML/kitten-inference (never a fork), once every job above passed, with
    # PyPI trusted publishing (no API token) and the pypi environment's approval. It uploads the wheels this run
    # assembled and tested, all at once, then checks that PyPI has every one of them, byte for byte, from this workflow.
    # A re-run uploads only what is missing (skip-existing; the assembled files are the same on every run).
    name: Publish to PyPI
    needs: [assemble, test, engines, old-linux, old-pip, lowest-deps, espeak-paths]
    if: github.event_name == 'push' && github.repository == 'KittenML/kitten-inference' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: assembled-*
          path: assembled
          merge-multiple: true
      - name: The files this tag uploads (kitten-inference wheels of its version, the complete set)
        run: |
          python3 .github/scripts/release_files.py assembled upload
          python3 .github/scripts/pypi_ready.py complete --dist kitten-inference upload/*.whl
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3: pinned to a commit (this job can upload to PyPI)
        with:
          packages-dir: upload/
          skip-existing: true
      - name: Every wheel is on PyPI, byte for byte, published by this workflow
        run: python3 .github/scripts/pypi_ready.py verify --version "${GITHUB_REF_NAME#v}" --timeout-minutes 30 upload/*.whl
