# Diagnostic (branch ws/engine-diag only): can tts-2/packaging/sass_manifest.py find the CUDA object files of a Windows
# build (MSVC /bigobj COFF, long section names) that hold given GPU functions? Builds only the CUDA-core decode
# kernels' object library of the wheel-windows preset, then lists its GPU functions and looks one function up both ways.
name: tts-2 cicc determinism (diagnostic)

on:
  push:
    branches: ["ws/engine-diag"]

permissions:
  contents: read

jobs:
  windows-objects:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CUDA 12.8.1 (compiler, runtime, cuRAND headers, cuobjdump, nvdisasm)
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\cuda_12.8.1_windows_network.exe"
          Invoke-WebRequest -Uri https://developer.download.nvidia.com/compute/cuda/12.8.1/network_installers/cuda_12.8.1_windows_network.exe -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList '-s nvcc_12.8 cudart_12.8 curand_12.8 curand_dev_12.8 thrust_12.8 cuobjdump_12.8 nvdisasm_12.8 visual_studio_integration_12.8' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CUDA installer failed with exit code $($p.ExitCode)" }
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$cuda\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build tools
        run: python -m pip install ninja==1.13.0
      - name: Configure and build the CUDA-core decode kernels' objects
        working-directory: tts-2
        run: |
          cmake --preset wheel-windows -DKT2N_BUILD_TEXT=OFF
          cmake --build build/wheel-windows --target kt2n_cuda_legacy_objs
      - name: Objects with GPU code, and one function looked up from its GPU code and from the sources
        working-directory: tts-2
        run: |
          python packaging/sass_manifest.py objects build/wheel-windows --arch sm_75
          python -c "import sys; sys.path.insert(0, 'packaging'); import sass_manifest as m; from pathlib import Path; d=[('sm_75', '_ZN12kt2n_tern_cc47_GLOBAL__N_13dec_cc_kernelILi8ELi4ELi4ELi4ELi2ELi1EEEvPK13__nv_bfloat16iiPK5uint4PKtPS2_iS4_ii')]; b=Path('build/wheel-windows'); a=m.objects_with(b, d); s=m.objects_of_sources(b, d); print('from GPU code:', a); print('from sources:', s); sys.exit(0 if a and s else 1)"
