name: tts-0.8

# Builds and tests the kitten-inference-tts08 wheels. Every wheel is installed with its
# dependencies and runs the unit tests and the audio smoke test (tts-0.8/tests).
# Publishing runs only for v* tags in KittenML/kitten-inference.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "tts-0.8/**"
      - ".github/workflows/tts-0.8.yml"
  pull_request:
    paths:
      - "tts-0.8/**"
      - ".github/workflows/tts-0.8.yml"

permissions:
  contents: read

concurrency:
  group: tts-0.8-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  linux-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 manylinux_2_28 CPython 3.8-3.15
            artifact: linux-x86_64-manylinux-2-28
            os: ubuntu-latest
            arch: x86_64
            manylinux_image: manylinux_2_28
            cmake_config_settings: >-
              cmake.define.ENABLE_CUDA=OFF
              cmake.define.ENABLE_NATIVE_ARCH=OFF
              cmake.define.ENABLE_X86_AVX2=ON
              cmake.define.ENABLE_ARM_DOTPROD=OFF
            cibw_build: >-
              cp38-manylinux_x86_64
              cp39-manylinux_x86_64
              cp310-manylinux_x86_64
              cp311-manylinux_x86_64
              cp312-manylinux_x86_64
              cp313-manylinux_x86_64
              cp314-manylinux_x86_64

    steps:
      - uses: actions/checkout@v5

      # The wheels are tested on the runner, not in the build container: the espeak-ng
      # library from espeakng_loader needs glibc 2.29, newer than both manylinux images.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.8"
          CIBW_CONFIG_SETTINGS: ${{ matrix.cmake_config_settings }}
          CIBW_BUILD_VERBOSITY: "1"
        with:
          package-dir: tts-0.8
          output-dir: wheelhouse

      # CPython 3.15 needs cibuildwheel 4, which no longer builds 3.8. Same image, flags and tests.
      - name: Build the CPython 3.15 wheel
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_BUILD: cp315-manylinux_${{ matrix.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_CONFIG_SETTINGS: ${{ matrix.cmake_config_settings }}
          CIBW_BUILD_VERBOSITY: "1"
        with:
          package-dir: tts-0.8
          output-dir: wheelhouse

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Test every wheel on the runner
        shell: bash
        run: |
          set -euo pipefail
          for py in 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.15; do
            tag="cp${py/./}"
            echo "::group::Python $py"
            uv venv -q -p "$py" "venv-$tag"
            uv pip install -q -p "venv-$tag/bin/python" wheelhouse/*-"$tag"-"$tag"-*.whl
            "venv-$tag/bin/python" -m unittest discover -s tts-0.8/tests -v
            "venv-$tag/bin/python" tts-0.8/tests/audio_smoke.py --mode release --out-dir "audio-smoke/$tag" \
              --cache-dir .hf-cache --expect-backend cpu
            "venv-$tag/bin/python" tts-0.8/tests/audio_smoke.py --mode paths --out-dir "audio-smoke/paths-$tag" \
              --cache-dir .hf-cache
            echo "::endgroup::"
          done

      # One Python per platform: micro and mini (fp32 and int8), two backends in one process, and
      # several models generating at once from different threads. Every check runs; the step fails if any did.
      - name: Every model, two backends, threads (CPython 3.12)
        shell: bash
        run: |
          set -uo pipefail
          py=venv-cp312/bin/python
          status=0
          for mode in models mix threads; do
            echo "::group::$mode"
            "$py" tts-0.8/tests/audio_smoke.py --mode "$mode" --out-dir "audio-smoke/$mode" --cache-dir .hf-cache \
              || { echo "::error::audio_smoke --mode $mode failed (exit $?)"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Oversubscribed threads (33 OpenMP threads on the runner's few cores), fp32 and int8
        shell: bash
        run: |
          set -euo pipefail
          nproc
          for i in 1 2 3; do
            OMP_NUM_THREADS=33 venv-cp312/bin/python tts-0.8/tests/audio_smoke.py --mode release \
              --out-dir "audio-smoke/omp33-$i" --cache-dir .hf-cache --expect-backend cpu > /dev/null
            echo "run $i ok"
          done

      - run: ls -l wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: tts08-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  desktop-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 CPython 3.8-3.15
            os: windows-2025-vs2026
            artifact: windows-x86_64
            cibw_build: >-
              cp38-win_amd64
              cp39-win_amd64
              cp310-win_amd64
              cp311-win_amd64
              cp312-win_amd64
              cp313-win_amd64
              cp314-win_amd64
            cibw_build_315: cp315-win_amd64
            cibw_archs_windows: AMD64
            cibw_archs_macos: auto
            cmake_config_settings: >-
              cmake.define.ENABLE_CUDA=OFF
              cmake.define.ENABLE_NATIVE_ARCH=OFF
              cmake.define.ENABLE_X86_AVX2=ON
              cmake.define.ENABLE_ARM_DOTPROD=OFF
            test_skip: ""
            test_command: >-
              python -m unittest discover -s {package}/tests -v &&
              python {package}/tests/audio_smoke.py --mode release --out-dir audio-smoke
              --cache-dir {project}/.hf-cache --expect-backend cpu &&
              python {package}/tests/audio_smoke.py --mode paths --out-dir audio-smoke-paths
              --cache-dir {project}/.hf-cache
            host_pythons: ""
            uv_python: cpython-3.12-windows-x86_64-none

          - name: macOS ARM64 CPython 3.8-3.15
            os: macos-26
            artifact: macos-arm64
            cibw_build: >-
              cp38-macosx_arm64
              cp39-macosx_arm64
              cp310-macosx_arm64
              cp311-macosx_arm64
              cp312-macosx_arm64
              cp313-macosx_arm64
              cp314-macosx_arm64
            cibw_build_315: cp315-macosx_arm64
            cibw_archs_windows: auto
            cibw_archs_macos: arm64
            cmake_config_settings: >-
              cmake.define.ENABLE_CUDA=OFF
              cmake.define.ENABLE_NATIVE_ARCH=OFF
              cmake.define.ENABLE_X86_AVX2=OFF
              cmake.define.ENABLE_ARM_DOTPROD=ON
            # cibuildwheel cannot run the cp38 arm64 wheel (its Python 3.8 is x86_64);
            # the next step tests it with an arm64 Python 3.8.
            test_skip: "cp38-macosx_arm64"
            test_command: >-
              python -m unittest discover -s {package}/tests -v &&
              python {package}/tests/audio_smoke.py --mode release --out-dir smoke-metal
              --cache-dir {project}/.hf-cache --expect-backend metal &&
              python {package}/tests/audio_smoke.py --mode release --out-dir smoke-cpu
              --cache-dir {project}/.hf-cache --backend cpu --expect-backend cpu --compare-to smoke-metal &&
              python {package}/tests/audio_smoke.py --mode paths --out-dir smoke-paths
              --cache-dir {project}/.hf-cache
            host_pythons: "3.8"
            uv_python: cpython-3.12-macos-aarch64-none

    steps:
      - uses: actions/checkout@v5

      # espeak-ng ignores a data path of 160 characters or more, and the default macOS temp
      # dir makes the test venv's espeak-ng-data path 161 characters long.
      - name: Use a short temp dir
        if: runner.os == 'macOS'
        run: mkdir -p /tmp/cibw && echo "TMPDIR=/tmp/cibw" >> "$GITHUB_ENV"

      # Windows: bundle the MSVC C++ and OpenMP runtimes (msvcp140, vcomp140), which Python does not ship.
      # kitten_inference is a namespace package, so delvewheel must not create its __init__.py.
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.8"
          CIBW_CONFIG_SETTINGS: ${{ matrix.cmake_config_settings }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_archs_windows }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_BUILD_WINDOWS: pip install "delvewheel>=1.10"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --namespace-pkg kitten_inference -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: ${{ matrix.test_command }}
          CIBW_TEST_SKIP: ${{ matrix.test_skip }}
          CIBW_BUILD_VERBOSITY: "1"
        with:
          package-dir: tts-0.8
          output-dir: wheelhouse

      # CPython 3.15 needs cibuildwheel 4, which no longer builds 3.8. Same flags, repair and tests.
      - name: Build and test the CPython 3.15 wheel
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_BUILD: ${{ matrix.cibw_build_315 }}
          CIBW_CONFIG_SETTINGS: ${{ matrix.cmake_config_settings }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_archs_windows }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_BUILD_WINDOWS: pip install "delvewheel>=1.10"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --namespace-pkg kitten_inference -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: ${{ matrix.test_command }}
          CIBW_BUILD_VERBOSITY: "1"
        with:
          package-dir: tts-0.8
          output-dir: wheelhouse

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Test the cp38 arm64 wheel (Metal, then CPU)
        if: matrix.host_pythons != ''
        shell: bash
        run: |
          set -euo pipefail
          for py in ${{ matrix.host_pythons }}; do
            tag="cp${py/./}"
            # A managed arm64 interpreter: the runner's own Python 3.8 is x86_64.
            uv venv -q --managed-python -p "cpython-$py-macos-aarch64-none" "venv-$tag"
            uv pip install -q -p "venv-$tag/bin/python" wheelhouse/*-"$tag"-"$tag"-*.whl
            "venv-$tag/bin/python" -c "import platform; print(platform.python_version(), platform.machine())"
            "venv-$tag/bin/python" -m unittest discover -s tts-0.8/tests -v
            "venv-$tag/bin/python" tts-0.8/tests/audio_smoke.py --mode release --out-dir "smoke-metal-$tag" \
              --cache-dir .hf-cache --expect-backend metal
            "venv-$tag/bin/python" tts-0.8/tests/audio_smoke.py --mode release --out-dir "smoke-cpu-$tag" \
              --cache-dir .hf-cache --backend cpu --expect-backend cpu --compare-to "smoke-metal-$tag"
          done

      # One Python per platform: micro and mini (fp32 and int8; on Apple Silicon on Metal, then on the CPU,
      # compared), two backends in one process, and several models generating at once from different threads.
      # Every check runs; the step fails if any did.
      - name: Every model, two backends, threads (CPython 3.12)
        shell: bash
        run: |
          set -uo pipefail
          uv venv -q --managed-python -p "${{ matrix.uv_python }}" venv-312
          py=venv-312/bin/python
          [ -x "$py" ] || py=venv-312/Scripts/python.exe
          uv pip install -q -p "$py" wheelhouse/*-cp312-cp312-*.whl
          "$py" -c "import platform; print(platform.python_version(), platform.machine())"
          status=0
          run() {
            echo "::group::$*"
            "$py" tts-0.8/tests/audio_smoke.py --cache-dir .hf-cache "$@" \
              || { echo "::error::audio_smoke $* failed (exit $?)"; status=1; }
            echo "::endgroup::"
          }
          if [ "${{ matrix.artifact }}" = macos-arm64 ]; then
            run --mode models --out-dir models-metal --expect-backend metal
            run --mode models --out-dir models-cpu --backend cpu --expect-backend cpu --compare-to models-metal
          else
            run --mode models --out-dir models --expect-backend cpu
          fi
          run --mode mix --out-dir mix
          run --mode threads --out-dir threads
          exit $status

      - run: ls -l wheelhouse
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: tts08-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  android-wheels:
    if: false
    # Experimental and non-blocking. Built, not tested: cibuildwheel runs Android tests only in an
    # emulator of the runner's own architecture (x86_64 here), and numpy, soundfile and
    # espeakng_loader publish no Android wheels on PyPI.
    name: Android ARM64 CPython 3.13 (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pre-cache Android target Python
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.cache/cibuildwheel"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
            --output "$HOME/.cache/cibuildwheel/python-3.13.12-aarch64-linux-android.tar.gz" \
            "https://repo.maven.apache.org/maven2/com/chaquo/python/python/3.13.12/python-3.13.12-aarch64-linux-android.tar.gz"

      - name: Build Android wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_ARCHS_ANDROID: arm64_v8a
          ANDROID_API_LEVEL: "24"
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.8"
          CIBW_CONFIG_SETTINGS_ANDROID: >-
            cmake.define.ENABLE_CUDA=OFF
            cmake.define.ENABLE_NATIVE_ARCH=OFF
            cmake.define.ENABLE_X86_AVX2=OFF
            cmake.define.ENABLE_ARM_DOTPROD=ON
            cmake.define.ENABLE_OPENMP=OFF
          CIBW_BUILD_VERBOSITY_ANDROID: "1"
        with:
          package-dir: tts-0.8
          output-dir: wheelhouse

      - run: ls -l wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: tts08-wheels-android-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error


  macos-openmp-probe:
    # Measurement only (this branch is not for merging): the shipped macOS build has no OpenMP. Build the same
    # source with Homebrew's libomp and time 1 thread against all cores on the same runner, plus Metal on arm64.
    name: macOS OpenMP probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arm: "OFF"
            avx2: "ON"
          - os: macos-26
            arm: "ON"
            avx2: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Build without and with OpenMP, then time them
        shell: bash
        run: |
          set -euxo pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.physicalcpu || true
          mkdir -p /tmp/cibw; export TMPDIR=/tmp/cibw
          brew install libomp
          omp=$(brew --prefix libomp)
          common="-C cmake.define.ENABLE_CUDA=OFF -C cmake.define.ENABLE_NATIVE_ARCH=OFF -C cmake.define.ENABLE_X86_AVX2=${{ matrix.avx2 }} -C cmake.define.ENABLE_ARM_DOTPROD=${{ matrix.arm }}"
          MACOSX_DEPLOYMENT_TARGET=11.0 uv build --wheel -p 3.12 --out-dir dist-plain -C build-dir=build/plain \
            -C build.verbose=true $common tts-0.8 > build-plain.log 2>&1 || { tail -60 build-plain.log; exit 1; }
          CMAKE_ARGS="-DOpenMP_CXX_FLAGS='-Xclang -fopenmp -I$omp/include' -DOpenMP_CXX_LIB_NAMES=omp -DOpenMP_omp_LIBRARY=$omp/lib/libomp.dylib" \
            uv build --wheel -p 3.12 --out-dir dist-omp -C build-dir=build/omp \
            -C build.verbose=true $common tts-0.8 > build-omp.log 2>&1 || { tail -60 build-omp.log; exit 1; }
          grep -h -i "openmp" build-plain.log build-omp.log | sort | uniq -c
          ls -l dist-plain dist-omp
          for v in plain omp; do
            uv venv -q --managed-python -p 3.12 venv-$v
            uv pip install -q -p venv-$v/bin/python dist-$v/*.whl
          done
          models="KittenML/kitten-tts-nano-0.8 KittenML/kitten-tts-mini-0.8 KittenML/kitten-tts-nano-0.8-int8"
          venv-plain/bin/python tts-0.8/tests/probe_timing.py --label shipped-no-openmp $models
          OMP_NUM_THREADS=1 venv-omp/bin/python tts-0.8/tests/probe_timing.py --label openmp-1-thread $models
          venv-omp/bin/python tts-0.8/tests/probe_timing.py --label openmp-all-cores $models
          if [ "$(uname -m)" = arm64 ]; then
            venv-plain/bin/python tts-0.8/tests/probe_timing.py --backend metal --label metal $models KittenML/kitten-tts-mini-0.8-int8
          fi

  oldest-linux:
    if: false
    # The oldest Linux the README promises: Ubuntu 20.04 (glibc 2.31) with its own Python 3.8.
    # pip picks the wheel, as it would for a user.
    name: Ubuntu 20.04, Python 3.8, x86_64
    needs: linux-wheels
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: tts08-wheels-linux-x86_64-*
          path: wheelhouse
          merge-multiple: true

      - name: Install
        run: |
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv > /dev/null
          ldd --version | head -1
          python3 -m venv venv
          venv/bin/python -m pip install -q --upgrade pip
          venv/bin/python -m pip install --find-links wheelhouse kitten-inference-tts08
          venv/bin/python -m pip list | grep -i -E "kitten|espeak|phonemizer|soundfile|numpy|huggingface"

      - name: Test
        run: |
          venv/bin/python -m unittest discover -s tts-0.8/tests -v
          venv/bin/python tts-0.8/tests/audio_smoke.py --mode release --out-dir audio-smoke --cache-dir .hf-cache --expect-backend cpu

  lowest-deps:
    if: false
    name: Lowest dependencies, Linux x86_64, Python ${{ matrix.python }}
    needs: linux-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - uses: actions/download-artifact@v7
        with:
          name: tts08-wheels-linux-x86_64-manylinux-2-28
          path: wheelhouse

      - name: Install the wheel with the oldest allowed dependencies
        shell: bash
        run: |
          set -euo pipefail
          tag="cp${PY/./}"
          wheel=$(ls wheelhouse/*-"$tag"-"$tag"-*.whl)
          # The wheel's own requirements, so the lower bounds come from the built metadata.
          python3 - "$wheel" > requirements-lowest.txt <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              for line in z.read(meta).decode().splitlines():
                  if line.startswith("Requires-Dist:"):
                      print(line.split(":", 1)[1].strip())
          PY
          cat requirements-lowest.txt
          uv venv -q -p "$PY" venv
          # Lowest version of each requirement that has a wheel for this Python.
          uv pip install -p venv/bin/python --resolution lowest-direct --no-build "$wheel" -r requirements-lowest.txt
          uv pip freeze -p venv/bin/python
        env:
          PY: ${{ matrix.python }}

      - name: Test
        run: |
          venv/bin/python -m unittest discover -s tts-0.8/tests -v
          venv/bin/python tts-0.8/tests/audio_smoke.py --mode release --out-dir audio-smoke --cache-dir .hf-cache --expect-backend cpu

  wheel-list:
    if: false
    name: Wheel list and contents
    needs: [linux-wheels, desktop-wheels, android-wheels]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: tts08-wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels and check their contents
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib, pathlib, sys, zipfile
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          print(f"{len(wheels)} wheels\n\n| wheel | bytes | sha256 |\n|---|---:|---|")
          bad = []
          for w in wheels:
              names = zipfile.ZipFile(w).namelist()
              if "kitten_inference/__init__.py" in names:
                  bad.append(f"{w.name}: ships kitten_inference/__init__.py")
              if not any(n.startswith("kitten_inference/tts08/_engine") for n in names):
                  bad.append(f"{w.name}: no _engine extension")
              if not any(n.endswith("model_defs/kitten_int8_15m_arch.json") for n in names):
                  bad.append(f"{w.name}: no model_defs")
              if "macosx" in w.name and "kitten_inference/tts08/metal_kernels.metallib" not in names:
                  bad.append(f"{w.name}: no metallib")
              if "-win_" in w.name:
                  libs = [n.lower() for n in names if n.startswith("kitten_inference_tts08.libs/")]
                  for dll in ("msvcp140", "vcomp140"):
                      if not any(n.split("/")[-1].startswith(dll) for n in libs):
                          bad.append(f"{w.name}: {dll} not bundled")
              print(f"| {w.name} | {w.stat().st_size} | {hashlib.sha256(w.read_bytes()).hexdigest()} |")
          print("\n" + ("\n".join(bad) if bad else "contents ok"))
          sys.exit(1 if bad else 0)
          PY

  publish:
    name: Publish to PyPI
    needs: [linux-wheels, desktop-wheels, android-wheels, oldest-linux, lowest-deps, wheel-list]
    if: >-
      always() &&
      github.repository == 'KittenML/kitten-inference' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.linux-wheels.result == 'success' &&
      needs.desktop-wheels.result == 'success' &&
      needs.oldest-linux.result == 'success' &&
      needs.lowest-deps.result == 'success' &&
      needs.wheel-list.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: tts08-wheels-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
