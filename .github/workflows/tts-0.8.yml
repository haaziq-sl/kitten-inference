name: tts-0.8

# Measurement only (never merge): memory over many identical generate() calls on the macOS ARM64 runner, Metal and
# CPU, for the engine at this branch's head.

on:
  push:
    branches: ["ws/integ-metal-leak-probe"]

permissions:
  contents: read

jobs:
  probe:
    name: macOS ARM64 memory probe (cp312)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Use a short temp dir
        run: mkdir -p /tmp/cibw && echo "TMPDIR=/tmp/cibw" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Build the cp312 wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp312-macosx_arm64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.ENABLE_CUDA=OFF
            cmake.define.ENABLE_NATIVE_ARCH=OFF
            cmake.define.ENABLE_X86_AVX2=OFF
            cmake.define.ENABLE_ARM_DOTPROD=ON
          CIBW_TEST_SKIP: "*"
        with:
          package-dir: tts-0.8
          output-dir: wheelhouse
      - name: Memory over 100 calls after 10 warm-up calls (Metal, then CPU)
        shell: bash
        run: |
          uv venv -q --managed-python -p cpython-3.12-macos-aarch64-none venv
          uv pip install -q -p venv/bin/python wheelhouse/*.whl
          sysctl -n machdep.cpu.brand_string hw.memsize
          for backend in metal cpu metal; do
            venv/bin/python tts-0.8/tests/audio_smoke.py --mode memory --out-dir "m-$backend" --cache-dir .hf-cache \
              --backend "$backend" 2>&1 | grep -E '^\{"model"|AssertionError' || true
          done
