[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

# The only metadata users see. Every kitten-inference wheel on PyPI carries the METADATA and entry_points.txt built
# from this table, unchanged: .github/scripts/assemble_wheels.py merges this wheel (kitten_inference/__init__.py and
# that metadata; a build input, never uploaded) with the tested engine wheels into one wheel per platform and Python,
# and adds only the License-File lines of the licence files it copies.
[project]
name = "kitten-inference"
version = "0.2.0"
description = "Kitten TTS inference engines: TTS 0.8 on the CPU, TTS 2 on NVIDIA and AMD GPUs"
readme = "README.md"
# KittenML's code is Apache-2.0. The wheels also carry third-party code, listed in NOTICE, tts-0.8/NOTICE and
# tts-2/NOTICE (every wheel has all three in its .dist-info/licenses), and one expression covers every wheel, because
# their METADATA must be the same. TTS 0.8: stb (MIT), pybind11 (BSD-3-Clause), libgomp (GPL-3.0-or-later WITH
# GCC-exception-3.1, Linux), libc++ (Apache-2.0 WITH LLVM-exception, Android), the Microsoft Visual C++ runtime
# (Windows). TTS 2: code and tables under MIT, Apache-2.0 and BSD-3-Clause, FFmpeg's atempo (LGPL-2.1-or-later),
# numpy.random and the ROCm Device Libraries (NCSA), Python's difflib and Unicode tables (PSF-2.0, Unicode-3.0),
# fdlibm (SunPro), PCRE2 (BSD-3-Clause WITH PCRE2-exception), the static Microsoft Visual C++ runtime (Windows) and
# the NVIDIA CUDA runtime (the CUDA engines, under NVIDIA's CUDA EULA).
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND LGPL-2.1-or-later AND NCSA AND PSF-2.0 AND Unicode-3.0 AND SunPro AND BSD-3-Clause WITH PCRE2-exception AND GPL-3.0-or-later WITH GCC-exception-3.1 AND Apache-2.0 WITH LLVM-exception AND LicenseRef-Microsoft-Visual-C-Runtime AND LicenseRef-NVIDIA-CUDA-EULA"
# The other licence files (NOTICE, tts-0.8/NOTICE and licenses/, tts-2/NOTICE and licenses/) are outside this folder;
# assemble_wheels.py adds them, at those paths, to every wheel.
license-files = ["LICENSE"]
# TTS 0.8 runs on Python 3.8; TTS 2 needs 3.9 (the [tts-2] markers, and a message when it starts on 3.8). No upper
# cap: one would make pip fall back to earlier releases on newer Pythons.
requires-python = ">=3.8"
authors = [{ name = "KittenML" }]
keywords = ["tts", "text-to-speech", "speech", "kitten-tts", "cuda", "rocm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

# The engines are in the package itself; the extras add only the Python libraries each one needs. They must match
# the engines' own pyprojects (tts-0.8/pyproject.toml, tts-2/python/pyproject.toml): assemble_wheels.py refuses drift.
# [tts-2] is limited to where Kitten TTS 2 runs (Linux x86-64 and Windows x64, Python 3.9 or newer), so elsewhere it
# installs nothing (no tokenizers build from source) and TTS 2 says at start that it does not run there.
[project.optional-dependencies]
"tts-0.8" = ["espeakng_loader>=0.2.4", "phonemizer>=3.3", "soundfile>=0.12.1", "numpy>=1.23", "huggingface_hub>=0.20"]
"tts-2" = [
    'numpy>=1.24; python_version >= "3.9" and ((sys_platform == "linux" and platform_machine == "x86_64") or (sys_platform == "win32" and platform_machine == "AMD64"))',
    'huggingface-hub>=0.25,<2; python_version >= "3.9" and ((sys_platform == "linux" and platform_machine == "x86_64") or (sys_platform == "win32" and platform_machine == "AMD64"))',
    'tokenizers>=0.22,<0.23; python_version >= "3.9" and ((sys_platform == "linux" and platform_machine == "x86_64") or (sys_platform == "win32" and platform_machine == "AMD64"))',
    'filelock>=3.12; python_version >= "3.9" and ((sys_platform == "linux" and platform_machine == "x86_64") or (sys_platform == "win32" and platform_machine == "AMD64"))',
]

[project.scripts]
kitten-tts2 = "kitten_inference.tts2._cli:main"

[project.urls]
Homepage = "https://github.com/KittenML/kitten-inference"
Source = "https://github.com/KittenML/kitten-inference"
Issues = "https://github.com/KittenML/kitten-inference/issues"

[tool.hatch.build.targets.wheel]
# Core metadata 2.4 (with the PEP 639 licence fields), which PyPI and twine 6.x accept; newer hatchling writes 2.5.
core-metadata-version = "2.4"
packages = ["kitten_inference"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["kitten_inference", "tests", "README.md", "LICENSE"]
