[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
# An internal build name: this wheel is a build input of the kitten-inference wheels (which also hold the CUDA and ROCm
# engines) and is never uploaded. kitten-inference's metadata comes from umbrella/pyproject.toml.
name = "kitten-inference-tts2"
version = "0.2.0"
description = "Kitten TTS 2 text-to-speech on NVIDIA and AMD GPUs: Python API and kitten-tts2 command"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "KittenML" }]
keywords = ["tts", "text-to-speech", "speech", "kitten-tts", "cuda", "rocm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Runtime and first-use model preparation (no torch). The [tts-2] extra in umbrella/pyproject.toml must name the same
# (the assembler refuses drift), limited there to Python 3.9+ on Linux x86-64 and Windows x64.
dependencies = [
    "numpy>=1.24",
    "huggingface-hub>=0.25,<2",
    "tokenizers>=0.22,<0.23",
    "filelock>=3.12",
]

[project.scripts]
kitten-tts2 = "kitten_inference.tts2._cli:main"

[project.urls]
Homepage = "https://github.com/KittenML/kitten-inference"
Source = "https://github.com/KittenML/kitten-inference/tree/main/tts-2"
Issues = "https://github.com/KittenML/kitten-inference/issues"

[tool.hatch.build.targets.wheel]
# Core metadata 2.4 (with the PEP 639 licence fields), which PyPI and twine 6.x accept; newer hatchling writes 2.5.
core-metadata-version = "2.4"
# kitten_inference/__init__.py comes from umbrella/ when the kitten-inference wheels are assembled: only tts2/ ships
# here.
only-include = ["kitten_inference/tts2"]
# _assets, NOTICE and licenses are added by hatch_build.py (copied from tts-2/ at build time).
exclude = ["__pycache__", "*.pyc", "/kitten_inference/tts2/_assets", "/kitten_inference/tts2/NOTICE",
           "/kitten_inference/tts2/licenses"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["kitten_inference/tts2", "tests", "hatch_build.py", "README.md", "LICENSE"]
exclude = ["__pycache__", "*.pyc", "/kitten_inference/tts2/_assets", "/kitten_inference/tts2/NOTICE",
           "/kitten_inference/tts2/licenses"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
