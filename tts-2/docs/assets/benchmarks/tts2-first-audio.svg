<text x="40.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Short texts, median, lower is better. Gray bars are the complete file: vLLM and llama.cpp stream whole sentences.</text>
