<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="708" viewBox="0 0 1000 708" role="img" aria-labelledby="t d">
<title id="t">Kitten TTS 2: time to the first streamed audio</title>
<desc id="d">Median time to the first streamed audio on short texts; for vLLM and llama.cpp this is the complete file, because they stream whole sentences. RTX PRO 6000 (96 GB): Kitten TTS 2 11.4 ms, vLLM, 4-bit 481 ms, vLLM, bf16 (default) 643 ms, llama.cpp (GPU) 538 ms; RTX 4090 (24 GB): Kitten TTS 2 22.1 ms, vLLM, 4-bit 887 ms, vLLM, bf16 (default) 1171 ms, llama.cpp (GPU) 971 ms; RTX 3060 (12 GB): Kitten TTS 2 57.5 ms, vLLM, 4-bit 1185 ms, vLLM, bf16 (default) 2018 ms, llama.cpp (GPU) 1182 ms</desc>
